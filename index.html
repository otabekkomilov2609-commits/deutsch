<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Deutsch A1 · A2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one reading column; Momente modules as chapters, each Lektion a handout-style card with its sheets. */
:root{
  --bg:#F2F5FA; --surface:#FFFFFF; --surface-2:#E9EFF8; --ink:#17243C; --muted:#56667F; --line:#D3DCE9;
  --blue:#1F4FA0; --blue-soft:#E2EAF8; --orange:#C95F17; --orange-soft:#FBEADB;
  --green:#2B7653; --green-soft:#DFF0E6; --slate:#4A5872; --slate-soft:#E6EAF1;
  --shadow:0 1px 2px rgba(23,36,60,.06),0 4px 14px rgba(23,36,60,.06);
  --hand:"Patrick Hand","Comic Neue","Comic Sans MS",cursive;
  --sans:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1524; --surface:#16203A; --surface-2:#1C2846; --ink:#E5EBF5; --muted:#9AA8C0; --line:#2A3858;
  --blue:#8DB0F0; --blue-soft:#1E2E52; --orange:#F2A469; --orange-soft:#3A2919;
  --green:#78CDA2; --green-soft:#183A2A; --slate:#B3BFD3; --slate-soft:#243150;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1524; --surface:#16203A; --surface-2:#1C2846; --ink:#E5EBF5; --muted:#9AA8C0; --line:#2A3858;
  --blue:#8DB0F0; --blue-soft:#1E2E52; --orange:#F2A469; --orange-soft:#3A2919;
  --green:#78CDA2; --green-soft:#183A2A; --slate:#B3BFD3; --slate-soft:#243150;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}

/* header */
header{padding-block:28px 8px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.lang button{border:0;background:none;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--blue);color:var(--surface)}
h1{font-family:var(--hand);font-weight:400;font-size:clamp(44px,9vw,64px);line-height:1;margin:14px 0 6px;color:var(--blue);letter-spacing:.01em}
.lead{margin:0;max-width:56ch;color:var(--muted);font-size:17px;text-wrap:pretty}
.lead b{color:var(--ink);font-weight:600}

/* controls */
.controls{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;margin-top:10px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;box-shadow:var(--shadow)}
.search svg{flex:none;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:none;font:inherit;color:var(--ink);padding:11px 0;outline:none}
.search input::placeholder{color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.tabs{display:flex;flex-wrap:wrap;gap:4px;background:var(--surface-2);padding:4px;border-radius:12px}
.tabs button{border:0;background:none;padding:6px 12px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);padding:5px 11px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}
.chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}

/* sections */
main{padding-block:6px 40px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:26px 0 12px}
.sec-h h2{font-family:var(--hand);font-weight:400;font-size:28px;margin:0;line-height:1.1;text-wrap:balance}
.sec-h small{color:var(--muted);font-size:13px}

.recent{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.modul{margin-top:30px}
.modul-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.modul-h .tag{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.modul-h .rule{flex:1;height:1px;background:var(--line)}
.review{background:var(--surface-2);border-radius:14px;padding:12px;margin-bottom:12px}
.review h4{margin:0 0 10px;font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}

/* lektion card */
.lek{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;scroll-margin-top:140px}
.lek-h{display:flex;gap:14px;align-items:flex-start}
.num{flex:none;width:46px;height:46px;border-radius:50%;background:var(--blue);color:var(--surface);display:grid;place-items:center;font-family:var(--hand);font-size:26px;line-height:1}
.lek-h h3{margin:2px 0 2px;font-family:var(--hand);font-weight:400;font-size:24px;line-height:1.15;text-wrap:balance}
.thema{color:var(--muted);font-size:14px}
.thema .kb{font-variant-numeric:tabular-nums;white-space:nowrap}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:14px 0 0;font-size:15px}
.facts dt{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding-top:3px;white-space:nowrap}
.facts dd{margin:0;min-width:0}
.facts .g{color:var(--blue)} .facts .k{color:var(--green)} .facts .w{color:var(--orange)}
.lek.empty .facts{opacity:.95}
.none{margin-top:12px;font-size:13px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px}

/* materials */
.mats{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:14px}
.mat{display:flex;gap:12px;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:left;min-width:0;transition:border-color .15s,transform .15s}
.mat:hover{border-color:var(--blue)}
.mat a.open{color:inherit;text-decoration:none}
.mat .open{display:flex;gap:12px;flex:1;min-width:0;border:0;background:none;padding:0;text-align:left;align-items:flex-start}
.thumb{flex:none;width:58px;aspect-ratio:210/297;border-radius:4px;background:#fff center/cover no-repeat;border:1px solid var(--line);max-width:100%}
.mat-b{min-width:0;display:flex;flex-direction:column;gap:3px}
.mat-t{font-weight:600;font-size:14.5px;line-height:1.3;overflow-wrap:anywhere}
.meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.type{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:999px}
.t-grammatik{background:var(--blue-soft);color:var(--blue)}
.t-wortschatz{background:var(--orange-soft);color:var(--orange)}
.t-sprechen{background:var(--green-soft);color:var(--green)}
.t-loesung{background:var(--slate-soft);color:var(--slate)}
.t-test{background:var(--slate-soft);color:var(--slate)}
.t-liste{background:var(--slate-soft);color:var(--slate)}
.new{color:var(--orange);font-weight:700}
.mat-act{display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;gap:6px;margin-left:auto}
.dlb{border:1px solid var(--line);background:none;border-radius:8px;font-size:15px;line-height:1;padding:5px 9px;color:var(--muted);cursor:pointer}
.dlb:hover{color:var(--ink,inherit);border-color:var(--muted)}
.sol{border:1px dashed var(--line);background:none;border-radius:8px;font-size:12px;font-weight:600;padding:4px 8px;color:var(--muted);white-space:nowrap}
.sol:hover{color:var(--ink);border-color:var(--ink)}
.recent .mat{flex-direction:column}
.recent .from{font-size:12px;color:var(--muted)}
.empty-state{padding:40px 0;text-align:center;color:var(--muted)}
footer{border-top:1px solid var(--line);padding-block:18px 28px;color:var(--muted);font-size:13px;text-align:center}
footer .sig{font-family:var(--hand);font-size:20px;color:var(--ink)}

.cur{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--surface);background:var(--blue);border-radius:999px;padding:2px 9px;margin-bottom:4px}
.lek:has(.cur){border-color:var(--blue);border-width:1.5px}
.later{margin-top:30px;border-top:1px solid var(--line);padding-top:14px}
.later > summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.later[open] > summary{margin-bottom:6px}
.review.rv-top{margin-top:16px}
/* homework */
.hw-list li{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.hw-audio{width:100%;max-width:420px;height:36px;margin:2px 0 0 28px}
.ext{font-size:13px;font-weight:700;color:var(--blue);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:2px 10px;white-space:nowrap;margin-left:28px}
.lek-hw .ext{margin-left:6px}
.ext:hover{border-color:var(--blue)}
button.ext{background:none;cursor:pointer;font-family:inherit;line-height:inherit}
.hw{background:var(--surface);border:1.5px solid var(--orange);border-radius:16px;padding:16px 16px 14px;margin-top:22px;box-shadow:var(--shadow)}
.hw-h{display:flex;align-items:baseline;justify-content:space-between;gap:4px 12px;flex-wrap:wrap}
.hw-h h2{font-family:var(--hand);font-weight:400;font-size:30px;margin:0;color:var(--orange);line-height:1.1}
.hw-when{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.hw-when b{color:var(--orange);font-weight:700}
.hw-lek{display:inline-block;margin-top:4px;border:0;background:none;padding:0;font-size:14px;color:var(--blue);font-weight:600;text-align:left}
.hw-lek:hover{text-decoration:underline}
.grp{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-left:6px;color:var(--muted);vertical-align:1px}
.hw-list{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.hw-list label{display:flex;gap:10px;align-items:flex-start;font-size:16px;cursor:pointer}
.hw-list input{flex:none;width:18px;height:18px;margin:3px 0 0;accent-color:var(--orange)}
.hw-list input:checked + span{color:var(--muted);text-decoration:line-through}
.hw-note{margin:10px 0 0;font-size:14px;color:var(--muted)}
.hw-due{margin-top:10px;font-size:14px;font-weight:600}
.hw-mats{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.hw-mat{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;text-align:left}
.hw-mat:hover{border-color:var(--blue)}
.hw-top{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap}
.left{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:14px;padding:4px 12px;border-radius:999px;background:var(--orange-soft);color:var(--orange);font-variant-numeric:tabular-nums}
.left.urgent{background:var(--orange);color:var(--surface)}
.left.done{background:var(--slate-soft);color:var(--slate)}
.hw-task{font-family:var(--hand);font-size:24px;line-height:1.2;margin:8px 0 0;text-wrap:balance}
.bar{height:6px;border-radius:999px;background:var(--surface-2);margin-top:12px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--orange);border-radius:999px}
.bar.done > i{background:var(--slate)}
.span{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 12px;font-size:12.5px;color:var(--muted);margin-top:5px;font-variant-numeric:tabular-nums}
.span b{color:var(--ink);font-weight:600}
.span > span{white-space:nowrap}
.hw-entry + .hw-entry{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.hw-old{margin-top:14px;border-top:1px dashed var(--line);padding-top:10px}
.hw-old summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--muted)}
.hw-old .hw-entry{margin-top:12px}
.hw-empty{color:var(--muted);margin:8px 0 0}
.lek-hw{margin-top:12px;background:var(--orange-soft);border-radius:10px;padding:10px 12px;font-size:14.5px}
.lek-hw > b{color:var(--orange);font-size:12px;letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:4px}
.lek-hw ul{margin:0;padding-left:18px}
.lek-hw .d{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}

/* viewer */
.pg{position:relative;max-width:100%;--s:1}
.pg canvas{display:block}
.ia-in{position:absolute;box-sizing:border-box;border:0;border-bottom:1.5px solid transparent;background:rgba(31,79,160,.06);color:#1F4FA0;font-family:var(--hand),"Patrick Hand",sans-serif;font-size:calc(var(--s) * 13px);line-height:1;padding:0 2px;margin:0;text-align:center;border-radius:3px 3px 0 0;outline:none;min-width:0}
.ia-in.long{text-align:left;padding-left:calc(var(--s) * 4px)}
.ia-in:hover{background:rgba(31,79,160,.12)}
.ia-in:focus{background:rgba(31,79,160,.14);box-shadow:0 0 0 1.5px #1F4FA0}
.ia-in.ok{color:#2B7653;background:rgba(43,118,83,.12)}
.ia-in.bad{color:#C62828;background:rgba(198,40,40,.10)}
.ia-in.chk{color:#B35A00;background:rgba(201,95,23,.12)}
.ia-in.shown{color:#7A3EB1;background:rgba(122,62,177,.10)}
.ia-q{position:absolute;z-index:4;width:calc(var(--s) * 10px);height:calc(var(--s) * 10px);min-width:15px;min-height:15px;border-radius:50%;border:none;background:#C62828;color:#fff;font:700 max(11px,calc(var(--s) * 9.5px))/1 system-ui,sans-serif;padding:0;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;transform:translate(-50%,-55%)}
.ia-why{position:absolute;z-index:6;pointer-events:none;max-width:min(340px,70%);min-width:180px;background:var(--surface);color:var(--ink,#1b2433);border:1px solid #E3B6B6;border-left:4px solid #C62828;border-radius:8px;padding:7px 10px 8px;font:13.5px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;box-shadow:0 6px 18px rgba(0,0,0,.18);margin-top:4px}
.ia-why b{display:block;color:#C62828;font-weight:700;margin-bottom:2px}
.ia-why .r{display:block;margin-top:5px;padding-top:5px;border-top:1px dashed var(--line);color:var(--muted);font-size:12px}
.ia-why .r i{font-style:normal;font-weight:700}
.ia-fix{position:absolute;white-space:nowrap;font-family:var(--hand),"Patrick Hand",sans-serif;font-size:max(13px,calc(var(--s) * 12px));line-height:1.15;color:#fff;background:#C62828;padding:2px 6px;border-radius:6px;pointer-events:none;z-index:4;margin-top:3px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.ia-fix::before{content:"✓ ";opacity:.9}
.ia-in.bad,.ia-in.chk{text-decoration:line-through;text-decoration-thickness:1px}
.ia-in.bad:focus,.ia-in.chk:focus{text-decoration:none}
.ia-fix.chk{background:#B35A00}
.ia-o{position:absolute;border:1.5px solid transparent;background:transparent;padding:0;margin:0;cursor:pointer;border-radius:999px}
.ia-o.row{border-radius:6px}
.ia-o:hover{background:rgba(31,79,160,.08)}
.ia-o.sel{border-color:#1F4FA0;background:rgba(31,79,160,.10)}
.ia-o.strike.sel{border-color:transparent;background:linear-gradient(transparent calc(50% - 1px),#1F4FA0 calc(50% - 1px),#1F4FA0 calc(50% + 1px),transparent calc(50% + 1px))}
.ia-o.box.sel{border-color:transparent;background:none}
.ia-o.box.sel::before{content:"✕";position:absolute;left:0;top:50%;transform:translateY(-50%);font-size:calc(var(--s) * 13px);color:#1F4FA0;font-weight:700;line-height:1;width:calc(var(--s) * 11px);text-align:center}
.ia-o.ok{border-color:#2B7653;background:rgba(43,118,83,.14)}
.ia-o.bad{border-color:#C62828;background:rgba(198,40,40,.12)}
.ia-o.miss{border:1.5px dashed #2B7653}
.ia-o.shown{border-color:#7A3EB1;background:rgba(122,62,177,.12)}
.ia-o.strike.ok,.ia-o.strike.bad,.ia-o.strike.shown{background-image:linear-gradient(transparent calc(50% - 1px),currentColor calc(50% - 1px),currentColor calc(50% + 1px),transparent calc(50% + 1px))}
.ia-o.strike.ok{color:#2B7653}.ia-o.strike.bad{color:#C62828}.ia-o.strike.shown{color:#7A3EB1}
.ia-o.box.ok::before,.ia-o.box.bad::before,.ia-o.box.shown::before{content:"✕";position:absolute;left:0;top:50%;transform:translateY(-50%);font-size:calc(var(--s) * 13px);font-weight:700;line-height:1;width:calc(var(--s) * 11px);text-align:center}
.ia-o.box.ok::before{color:#2B7653}.ia-o.box.bad::before{color:#C62828}.ia-o.box.shown::before{color:#7A3EB1}
.ia-o.box.miss::before{content:"✕";position:absolute;left:0;top:50%;transform:translateY(-50%);font-size:calc(var(--s) * 13px);color:#2B7653;opacity:.6;width:calc(var(--s) * 11px);text-align:center}
.ia-side{position:absolute;right:max(8px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);z-index:5;display:flex;flex-direction:column;gap:5px;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.ia-side[hidden]{display:none}
.ia-keys[hidden]{display:none}
.ia-keys{display:grid;grid-template-columns:1fr;gap:4px}
.ia-k{width:58px;height:34px;border:1px solid var(--line);border-radius:9px;background:var(--bg);font-size:17px;cursor:pointer;color:inherit;padding:0;font-family:inherit}
.ia-k:active{transform:scale(.94)}
.ia-act{width:58px;min-height:38px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:3px 0;font-size:16px}
.ia-act small{font-size:9.5px;line-height:1;color:var(--muted);max-width:56px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ia-act.primary{background:var(--blue);color:var(--surface);border-color:var(--blue)}
.ia-act.primary small{color:var(--surface);opacity:.85}
.ia-score{font-size:11px;text-align:center;font-weight:700;line-height:1.25}
.ia-score .g{color:var(--green)} .ia-score .r{color:#C62828}
.snd{position:fixed;inset:0;z-index:90;background:rgba(10,18,35,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.snd[hidden]{display:none}
.snd-box{background:var(--surface);color:var(--ink);border-radius:16px;padding:20px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.snd-h{display:flex;justify-content:space-between;align-items:center;gap:8px}.snd-h h2{margin:0;font-size:18px}
.snd-x{border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer}
.snd-res{font-size:14px;color:var(--muted);line-height:1.35}.snd-res b{color:var(--green);font-size:16px}
.snd input{font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.snd-err{color:#C62828;font-size:13px}.snd-err:empty{display:none}.snd-hint{font-size:13px;color:var(--muted);line-height:1.35}
.snd .btn.primary{padding:11px;font-size:15px;cursor:pointer}
.snd-img{width:100%;max-height:46vh;object-fit:contain;border-radius:12px;background:var(--bg);-webkit-touch-callout:default;user-select:auto}
.snd-btns{display:flex;gap:8px}.snd-btns .btn{flex:1;min-width:0;white-space:normal;padding:11px 6px;font-size:15px;cursor:pointer}.snd-btns .btn[hidden]{display:none}

<!-- TOPSHIRIQLAR: yangi yozuv shu ro'yxatga qo'shiladi. Maydonlar: date (berilgan kun, YYYY-MM-DD), days (muhlat, kun), due (date+days, YYYY-MM-DD), lvl ("A1.1" / "A1.2" / "A2.1" / "A2.2"), title (topshiriq), items (ixtiyoriy punktlar; {"text","url"} yoki {"uz","ru"} bo'lishi mumkin), lektion, group, note, mats (ixtiyoriy MATS id lari) -->
<script type="application/json" id="tr-data">{"A2-a22-m5-Goethe-A2-Hoeren-1-Modellsatz":[{"h":"Teil 1","blocks":[{"h":"Aufgabe 1","qs":[1],"lines":[["","Eine Information für die Besucher des Basketballspiels heute in der Olympia-Halle: Die Parkplätze in der Nähe sind schon besetzt. [[1|Im Parkhaus am Einkaufszentrum gibt es noch freie Plätze.]] Besucher von außerhalb sollten nicht mit dem Auto kommen. Nehmen Sie die Bahn! Vom Hauptbahnhof gibt es kostenlose Busse zur Olympia-Halle."]]},{"h":"Aufgabe 2","qs":[2],"lines":[["","Hallo Sabine. [[2|Denk bitte an meinen dunklen Anzug.]] Du wolltest ihn doch aus der Reinigung abholen. Sonst weiß ich nicht, was ich bei Helenas Hochzeit morgen anziehen soll. Das Geschenk hab’ ich heute in der Mittagspause schon gekauft. Die Blumen holen wir ja erst morgen früh. Dank dir."]]},{"h":"Aufgabe 3","qs":[3],"lines":[["","Guten Tag Frau Meyer. Ingrid Sollms hier. Der Termin heute findet nicht in meinem Büro statt. Da ist ein Fehler in der Einladung. [[3|Ich habe im Hotel Leopold einen Raum reserviert.]] Sie wissen ja, am Bahnhofsplatz. Bitte kommen Sie um 10.00 Uhr direkt dorthin. Danke! Auf Wiederhören."]]},{"h":"Aufgabe 4","qs":[4],"lines":[["","Nun zum Wetter. Am Wochenende ist es im Norden windig und bewölkt. [[4|Es regnet bei maximal 17 Grad.]] Im Süden am Samstag sonnig und warm bis 25 Grad. [[4|Am Sonntag kommt das kalte Regenwetter dann auch nach Süddeutschland.]] Die Temperaturen fallen auch hier auf unter 15 Grad."]]},{"h":"Aufgabe 5","qs":[5],"lines":[["","Und jetzt unser Frühstücksradio-Gewinnspiel. Für alle, die es noch nicht kennen: Genau um 7.00 Uhr spielen wir ein neues Lied. [[5|Wenn Sie wissen, wie der Sänger heißt, rufen Sie uns an.]] Es gibt tolle Preise zu gewinnen: T-Shirts, CDs oder eine Eintrittskarte für ein Konzert Ihrer Wahl."]]}]},{"h":"Teil 2","blocks":[{"h":"Aufgaben 6–10","qs":[6,7,8,9,10],"lines":[["Mann","Sag mal, hast du schon Ideen für unsere Woche Urlaub? Wir wollen ja zu Hause bleiben, aber ich möchte schon jeden Tag etwas Besonderes machen. Vielleicht ein bisschen Sport? Oder Kultur?"],["Frau","Mal sehen, wir könnten ins Kino gehen, am Montag kommt ein guter Film."],["Mann","Gute Idee! Montags gibt’s dort Ermäßigung!"],["Frau","Und am Dienstag müssen wir zu unserem Tanzkurs, oder?"],["Mann","Diese Woche nicht, die Lehrerin ist auch im Urlaub. [[6|Wir könnten ins Theater gehen]], ich hab gesehen, es gibt ein interessantes Stück."],["Frau","Mhhm, warum nicht. Dann müssen wir am Mittwoch aber Sport machen!"],["Mann","Klar, wir können schwimmen gehen, im neuen Schwimmbad!"],["Frau","Aber du weißt doch, dass ich das nicht gerne mache. [[7|Können wir nicht einen Ausflug mit dem Rad machen?]]"],["Mann","Okay, das macht mir ja auch Spaß. Und was machen wir am Donnerstag und Freitag?"],["Frau","Am Donnerstag können wir Eis essen gehen, bei Francesco!"],["Mann","Moment, [[8|Donnerstagabend sind wir bei Julia und Tim zum Kochen eingeladen.]] Da sollten wir vorher nicht so viel essen."],["Frau","Ja, da hast du recht. Und wegen Freitag, [[9|da gehen wir zum Konzert vorm Rathaus!]] Da spielen tolle Bands."],["Mann","Okay, wie du möchtest. Aber am nächsten Tag, am Samstag, darfst du dann nicht so lange schlafen, [[10|da ist nämlich unsere Schifffahrt auf der Elbe.]]"],["Frau","Keine Sorge, ich werde früh wach sein und dir sogar das Frühstück ans Bett bringen! (lacht)"]]}]},{"h":"Teil 3","blocks":[{"h":"Aufgabe 11","qs":[11],"lines":[["Junge","Was hast du gestern Abend Tolles gegessen?"],["Mädchen","Ich wollte nur einen Hamburger haben, aber Lena und Sarah wollten lieber Fisch essen gehen. [[11|Im Fischrestaurant gab es auch Hähnchen, also habe ich das genommen.]] Es war o.k."],["Junge","Ja, dann ist es ja gut."]]},{"h":"Aufgabe 12","qs":[12],"lines":[["Frau","[[12|Entschuldigung, die Jacke da gefällt mir. Die mit den weißen Buchstaben.]]"],["Mann","Welche Größe haben Sie denn?"],["Frau","L"],["Mann","Ach, tut mir leid, aber diese haben wir nur noch in S. Aber vielleicht gefällt Ihnen die Jeansjacke hier oder der blaue Mantel?"],["Frau","Ne, die Jeansjacke gefällt mir nicht. Mhh, der Mantel ist hübsch, aber zu warm. Den brauch’ ich nicht."]]},{"h":"Aufgabe 13","qs":[13],"lines":[["Mann","Ja, bitte?"],["Frau","Guten Tag, Herr Thung. Hier ist Reimann vom Sportverein Ramersdorf. Ich rufe an wegen Ihrer Anmeldung."],["Mann","Das ausgefüllte Formular habe ich Ihnen gestern in den Briefkasten gesteckt."],["Frau","Ja, das habe ich hier, [[13|aber für den Ausweis brauchen wir noch ein Foto von Ihnen.]]"],["Mann","Kein Problem. Ich bring’ Ihnen morgen eins."],["Frau","Schön. Sonst haben wir alles, auch Ihre Unterschrift."],["Mann","Gut. Dann bis morgen."]]},{"h":"Aufgabe 14","qs":[14],"lines":[["Mann 1","Hallo Herr Talas. Hier Miguel Alba aus Haus Nr. 9. Wir haben gestern schon wegen der Reparaturen telefoniert."],["Mann 2","Ja. Der Mechaniker hat den Aufzug in Ihrem Haus gestern Abend noch repariert. Und die Lampe am Eingang geht auch wieder."],["Mann 1","Ja, ja. [[14|Aber jetzt wird die Heizung in meiner Wohnung nicht mehr warm.]] Können Sie vorbeikommen und sich das mal ansehen?"]]},{"h":"Aufgabe 15","qs":[15],"lines":[["Frau","Guten Tag, hier ist Messner von der Arztpraxis Vollmer."],["Mann","Ja? Guten Tag."],["Frau","Ich rufe an wegen Ihrer Krankengymnastik. Sie können nächste Woche Montag und Donnerstag um 16 Uhr kommen."],["Mann","Ja, das passt."],["Frau","Sie müssen nicht an der Information warten. [[15|Gehen Sie direkt in den Sportraum.]] Und bitte vergessen Sie das Rezept vom Arzt und Ihre Sportkleidung nicht."]]}]},{"h":"Teil 4","blocks":[{"h":"Aufgaben 16–20","qs":[16,17,18,19,20],"lines":[["Mann","Sarah, Sie kommen aus Ghana, in Afrika. Wann sind Sie nach Deutschland gekommen?"],["Frau","Das war kurz nach meinem fünften Geburtstag. Da sind wir dann mit der ganzen Familie umgezogen."],["Mann","Und wie fanden Sie das neue Leben in Deutschland?"],["Frau","[[16|Ja, es hat mir sofort gefallen]], ich habe ganz schnell Freunde gefunden – beim Fußballspielen auf der Straße. [[17|Meine beiden großen Brüder haben mich immer mitgenommen. Zuerst haben sie mir Tipps gegeben]], aber nach ein paar Monaten war ich besser als sie! (lacht)"],["Mann","Und dann? Wie ging es dann weiter?"],["Frau","[[18|Als ich in der Schule war, hat mein Sportlehrer mir gesagt, bei welchem Fußballverein ich mich anmelden soll.]] Und dort spiele ich immer noch."],["Mann","Jetzt schon seit 14 Jahren! Und seit zwei Wochen sind Sie sogar in der deutschen Frauennationalmannschaft. Glückwunsch!"],["Frau","Danke. [[19|Ja, und ich hoffe, dass ich bald auch einmal in einem internationalen Spiel mitspielen darf.]]"],["Mann","Was machen Sie denn, wenn Sie nicht Fußball spielen?"],["Frau","Im Moment habe ich keine Zeit für anderes. [[20|Aber später, wenn ich nicht mehr so gut bin, möchte ich studieren.]]"],["Mann","Und sagen Sie uns auch welches Fach?"],["Frau","Natürlich Sport!"],["Mann","Na dann, alles Gute für Sie und danke für das Gespräch."],["Frau","Gerne."]]}]}],"A2-a22-m5-Goethe-A2-Hoeren-2-Uebungssatz-01":[{"h":"Teil 1","blocks":[{"h":"Aufgabe 1","qs":[1],"lines":[["","Und jetzt noch eine wichtige Information für die Besucher des Musikfestes: Wegen des Regens kann das Konzert heute Abend nicht draußen auf dem Marktplatz stattfinden. Liebe Fans, keine Angst, es wird stattfinden – [[1|in der großen Halle am Bahnhof]], Beginn 18:30 Uhr. Wer sein Ticket zurückgeben möchte, kann das bis 18 Uhr am Schalter vor dem Festzelt kostenlos tun."]]},{"h":"Aufgabe 2","qs":[2],"lines":[["","Hallo, Frauke. Jana feiert doch am Freitag ihren Geburtstag im Büro. Ich backe morgen einen Kuchen. Wichtig ist noch das Geschenk. Paul hat gesagt, er kümmert sich darum. Er fährt heute nach der Arbeit in die Stadt und sucht ein spannendes Buch. [[2|Kannst du dich um Saft, Wasser und Kaffee kümmern?]] Rufst du mich zurück?"]]},{"h":"Aufgabe 3","qs":[3],"lines":[["","Hi, Paul, Clemens hier. Du, wir hatten ja gesagt, wir gehen diesen Samstag etwas trinken. Kannst du auch Sonntagabend? [[3|Am Samstagabend geht meine Frau mit Freunden aus]] und ich hab versprochen, dass ich zu Hause bleibe und auf die Kinder aufpasse. Sonntag kommen dann noch meine Eltern zu Besuch, aber ab 19 Uhr hab ich Zeit."]]},{"h":"Aufgabe 4","qs":[4],"lines":[["","Und nun zum Wetter: Der Sommer bleibt und es wird morgen nochmal sehr warm, [[4|im Süden bis 30 Grad. Am späten Nachmittag soll es dort etwas regnen.]] Vorsicht im Westen. Dort wird es bis zum frühen Nachmittag auch sehr warm, es soll am Nachmittag aber starke Gewitter geben. Im Norden und Osten wird es kühl mit Temperaturen bis 16 Grad. Aber es bleibt trocken."]]},{"h":"Aufgabe 5","qs":[5],"lines":[["","Achtung, liebe Fahrgäste, dieser Zug kann wegen eines technischen Problems nicht weiterfahren. Bitte alle aussteigen. [[5|Fahrgäste nach Frankfurt fahren bitte mit dem ICE 562 um 14.15 Uhr von Gleis 1.]] Fahrgäste nach Stuttgart nehmen bitte die S-Bahn um 14.22 Uhr von Gleis 4."]]}]},{"h":"Teil 2","blocks":[{"h":"Aufgaben 6–10","qs":[6,7,8,9,10],"lines":[["Mann","Sonja, was machst du denn hier? Ich denke, du bist in Köln."],["Frau","Letzte Woche war ich in Köln."],["Mann","Und wie war es?"],["Frau","Ach, es war toll! Am Freitag bin ich hingefahren. Meine Freundin Julia hat mich vom Bahnhof abgeholt und dann sind wir in einem guten Restaurant essen gegangen."],["Mann","Schön! Was habt ihr denn noch gemacht? Du wolltest doch die neue Ausstellung sehen."],["Frau","Ja, eigentlich am Samstag. Aber das Museum war wegen einer Veranstaltung geschlossen. [[6|Also waren wir im Theater.]]"],["Mann","Du interessierst dich wohl sehr für Kultur?"],["Frau","Ja, deshalb waren wir auch noch in einem Klavierkonzert. Julia wollte eigentlich am Sonntag gehen, aber wir haben leider keine Karten mehr gekriegt. [[7|Also waren wir den ganzen Tag in der Stadt und haben uns Sehenswürdigkeiten angesehen.]]"],["Mann","Das mach ich auch gern. Und wann wart ihr dann bei dem Klavierkonzert?"],["Frau","[[8|Am Montagabend.]] Montag gab es auch ein kostenloses Konzert von zwei Bands draußen vor der Universität. Das hätte mich auch interessiert."],["Mann","Man kann ja nicht alles haben. (lacht) Und Dienstag?"],["Frau","Ich wollte eigentlich mit dem Schiff auf dem Rhein, dem Fluss, fahren. Aber Julia hatte eine andere tolle Idee: [[9|eine Radtour am Fluss.]] Am Abend war ich total müde."],["Mann","War das Wetter denn gut?"],["Frau","Wir hatten Glück. Am Mittwoch hat es leider geregnet. Das war schade, weil wir auf ein Straßenfest gehen wollten. Das hat dann nicht geklappt. [[10|Wir waren dann in der Ausstellung, im Museum.]]"],["Mann","Darauf hattest du dich ja sehr gefreut."],["Frau","Die war sehr schön. Kann ich empfehlen!"]]}]},{"h":"Teil 3","blocks":[{"h":"Aufgabe 11","qs":[11],"lines":[["Frau","Schlemmer, hallo?"],["Mann","Hallo, Frau Schlemmer, hier Florian Mayer, Sie verkaufen alte Möbel."],["Frau","Ja."],["Mann","Heute Morgen hab’ ich Ihnen geschrieben, dass ich das Sofa kaufen möchte."],["Frau","Ja, ich erinnere mich."],["Mann","Tut mir leid, aber es ist zu groß, das kann ich nicht mit meinem Auto abholen. [[11|Aber der Wohnzimmertisch interessiert mich.]]"],["Frau","Können Sie haben. Und die vier Stühle, nehmen Sie die auch?"],["Mann","Da habe ich eigene."],["Frau","OK."]]},{"h":"Aufgabe 12","qs":[12],"lines":[["Mann","Du, Sabine, ich sammle Ideen für unseren Firmenausflug."],["Frau","Ah, ja! Was haben wir denn im letzten Jahr gemacht?"],["Mann","Eine interessante Stadtführung."],["Frau","Richtig! Die war toll. (nachdenklich) Im Stadtmuseum gibt es eine gute neue Kunstausstellung."],["Mann","Kunst, finde ich nicht so interessant."],["Frau","Okay, [[12|und wenn wir zum See fahren und dort eine Wanderung machen?]] Darauf hätt ich Lust."],["Mann","[[12|Ja, find ich gut.]]"]]},{"h":"Aufgabe 13","qs":[13],"lines":[["Frau","Och, Mann!"],["Mann","Guten Morgen, Frau Nachbarin! Was ist denn?"],["Frau","Morgen, Herr Köhler. Ich muss zur Arbeit und hab den Zug verpasst."],["Mann","Oh, wie ärgerlich. Warum nehmen Sie nicht Ihr Auto?"],["Frau","(seufzt) Das ist in der Werkstatt."],["Mann","[[13|Gut, dann fahren Sie bei mir mit. Ich muss jetzt auch mit dem Auto in die Stadt.]]"],["Frau","Das ist wirklich nett!"]]},{"h":"Aufgabe 14","qs":[14],"lines":[["Frau","Sanitär Reparaturen, guten Tag."],["Mann","Guten Tag. Mollack mein Name. Bei mir ist Wasser im Badezimmer. Ich brauche einen Handwerker."],["Frau","Ja, kein Problem. Kommt das Wasser aus der Dusche?"],["Mann","Die ist ganz trocken."],["Frau","Ah, gut, es kann natürlich auch die Waschmaschine sein."],["Mann","Die steht bei mir im Keller. [[14|Unter der Toilette ist das meiste Wasser.]]"],["Frau","Ah, ja, dann liegt da wohl das Problem."]]},{"h":"Aufgabe 15","qs":[15],"lines":[["Mann","Hallo, Frau Hansen! Hier Larsen. Ich kann heute leider nicht zur Arbeit kommen."],["Frau","Oh, sind Sie krank?"],["Mann","[[15|Meine Tochter hat eine Grippe und ich muss mit ihr zum Arzt gehen.]]"],["Frau","Wir haben doch heute den wichtigen Gesprächstermin! Kann das nicht Ihre Frau machen?"],["Mann","Meine Frau nimmt gleich das Taxi zum Flughafen. Sie muss beruflich für eine Woche nach London."]]}]},{"h":"Teil 4","blocks":[{"h":"Aufgaben 16–20","qs":[16,17,18,19,20],"lines":[["Moderator","Frau Plessing, Sie und Ihr Mann haben seit einem Jahr das erste Familienhotel in der Stadt. Wie kamen Sie auf diese Idee?"],["Frau","[[16|Unsere vier Kinder sind alle erwachsen und leben nicht mehr bei uns zu Hause. Ja, leider.]] Unser Leben war dann plötzlich sehr ruhig."],["Moderator","Ah, Sie wollten wieder Kontakt mit Kindern?"],["Frau","Ja, auch, und wir kennen die Arbeit im Hotel: [[17|Mein Mann hat viele Jahre in einem Hotel an der Rezeption gearbeitet und ich habe im Hotelrestaurant gekocht.]] Wir dachten, mit unseren Erfahrungen können wir auch selbst ein kleines Hotel führen. Wir wollten es versuchen."],["Moderator","Verstehe."],["Frau","Ja, und [[18|außerdem haben wir auf unseren Reisen gesehen, was in einem normalen Hotel nicht so gut ist, wenn man mit einer großen Familie unterwegs ist.]]"],["Moderator","Aha. Und hatten Sie schon viele Gäste?"],["Frau","Hier im Haus gibt es drei Wohnungen mit Küche für Familien, die gern alles selbst machen. [[19|Die waren von Anfang an fast immer vermietet.]] Außerdem haben wir drei große Zimmer, die kann man mit Frühstück buchen oder auch mit Mittag- und Abendessen. So wie man es braucht."],["Moderator","Ah, ja."],["Frau","In den Sommerferien war das Hotel voll. [[20|Jetzt gerade haben wir nicht viele Reservierungen.]]"],["Moderator","Dann hoffen wir, dass viele Familien unser Gespräch gehört haben und Ihr Hotel kennenlernen möchten. Alles Gute für Sie!"],["Frau","Vielen Dank!"]]}]}]}</script>
<script type="application/json" id="hint-data">{"_R":[{"uz":"der/das/die dan keyin: Nominativ birlikda → -e; Akkusativda die/das → -e, der → den …-en; Dativ va Plural → doim -en.","ru":"После der/das/die: Nominativ ед. ч. → -e; в Akkusativ die/das → -e, der → den …-en; Dativ и Plural → всегда -en."},{"uz":"ein/kein/mein dan keyin: Nominativ → der-so'z -er, das-so'z -es, die-so'z -e; Akkusativ → einen …-en, das -es, die -e; Dativ va Plural → doim -en.","ru":"После ein/kein/mein: Nominativ → муж. -er, ср. -es, жен. -e; Akkusativ → einen …-en, ср. -es, жен. -e; Dativ и Plural → всегда -en."},{"uz":"der/das/die dan keyin: Nominativ birlik → -e; Akkusativ die/das → -e, den …-en; Dativ va Plural → -en.","ru":"После der/das/die: Nominativ ед. ч. → -e; Akkusativ die/das → -e, den …-en; Dativ и Plural → -en."},{"uz":"Modal fe'l Präteritum: umlaut tushadi + -te: können → konnte, müssen → musste, dürfen → durfte, wollen → wollte, sollen → sollte. Shaxs qo'shimchasi: ich/er -te, du -test, wir/sie -ten, ihr -tet.","ru":"Präteritum модальных глаголов: без умлаута + -te: können → konnte, müssen → musste, dürfen → durfte, wollen → wollte, sollen → sollte. Окончания: ich/er -te, du -test, wir/sie -ten, ihr -tet."},{"uz":"durch, um … herum + Akkusativ (der → den, die → die, das → das). an … vorbei, gegenüber + Dativ (der/das → dem, die → der, Plural → den).","ru":"durch, um … herum + Akkusativ (der → den, die → die, das → das). an … vorbei, gegenüber + Dativ (der/das → dem, die → der, Plural → den)."},{"uz":"Fe'l + -er → shu ishni qiluvchi odam (der …). Fe'lning -en qismi tushadi; ba'zan umlaut qo'shiladi (verkaufen → Verkäufer).","ru":"Глагол + -er → человек, который это делает (der …). Окончание -en отпадает; иногда добавляется умлаут (verkaufen → Verkäufer)."},{"uz":"lassen: ich lasse, du lässt, er/sie/es lässt, wir lassen, ihr lasst, sie/Sie lassen. Umlaut faqat du va er/sie/es da.","ru":"lassen: ich lasse, du lässt, er/sie/es lässt, wir lassen, ihr lasst, sie/Sie lassen. Умлаут только у du и er/sie/es."},{"uz":"a = taklif (Lasst uns / Lassen Sie uns …) · b = olib ketmaslik, qoldirish (zu Hause, im Auto …) · c = o'zgartirmaslik (so lassen, wie es ist).","ru":"a = предложение (Lasst uns / Lassen Sie uns …) · b = не брать с собой, оставить (zu Hause, im Auto …) · c = не менять (так оставить, как есть)."},{"uz":"L19–21 Wortverbindungen: ein Sabbatical machen · Kontakte knüpfen · auf … verzichten · Heizkosten sparen · Vorträge halten · einen Baum pflanzen · Plastik vermeiden · an … teilnehmen.","ru":"Wortverbindungen L19–21: ein Sabbatical machen · Kontakte knüpfen · auf … verzichten · Heizkosten sparen · Vorträge halten · einen Baum pflanzen · Plastik vermeiden · an … teilnehmen."},{"uz":"n-Deklination: ba'zi erkak jinsli otlar (der Kunde, Kollege, Neffe, Junge, Student, Praktikant, Elefant, Mensch, Nachbar, Herr) Akkusativ, Dativ va Plural da -n/-en oladi. Nominativ birlikda — qo'shimcha yo'q.","ru":"n-Deklination: некоторые существительные муж. рода (der Kunde, Kollege, Neffe, Junge, Student, Praktikant, Elefant, Mensch, Nachbar, Herr) в Akkusativ, Dativ и Plural получают -n/-en. В Nominativ ед. ч. — без окончания."},{"uz":"Präteritum: muntazam fe'l → o'zak + -te (machen → machte); -t/-d bilan tugasa → -ete (arbeiten → arbeitete). Nomuntazam → yangi o'zak, -te yo'q (kommen → kam). ich/er shaklida oxiriga hech narsa qo'shilmaydi.","ru":"Präteritum: правильные глаголы → основа + -te (machen → machte); на -t/-d → -ete (arbeiten → arbeitete). Неправильные → новая основа, без -te (kommen → kam). У ich/er окончания нет."},{"uz":"Taklif: do'stlarga «Lasst uns …», hurmat bilan «Lassen Sie uns …» + … + Infinitiv gap oxirida.","ru":"Предложение: друзьям «Lasst uns …», вежливо «Lassen Sie uns …» + … + Infinitiv в конце."},{"uz":"Relativpronomen: Nominativ — der / die / das / die (Pl.); Akkusativ — den / die / das / die (Pl.). Jinsi oldingi otga qarab, kelishigi esa nisbiy gapdagi vazifasiga qarab. Fe'l nisbiy gap oxirida.","ru":"Relativpronomen: Nominativ — der / die / das / die (Pl.); Akkusativ — den / die / das / die (Pl.). Род — по существительному перед ним, падеж — по роли в придаточном. Глагол в конце придаточного."},{"uz":"Passiv: gap egasi + werden (2-o'rinda) + Partizip II (oxirida). werden: ich werde, du wirst, er/sie/es wird, wir werden, ihr werdet, sie/Sie werden.","ru":"Passiv: подлежащее + werden (2-е место) + Partizip II (в конце). werden: ich werde, du wirst, er/sie/es wird, wir werden, ihr werdet, sie/Sie werden."},{"uz":"deshalb = shuning uchun. «Deshalb» 1-o'rinda → fe'l 2-o'rinda → keyin gap egasi. weil esa fe'lni gap oxiriga yuboradi.","ru":"deshalb = поэтому. «Deshalb» на 1-м месте → глагол на 2-м → потом подлежащее. А weil отправляет глагол в конец."},{"uz":"dass-gapda fe'l gap oxirida turadi va gap egasiga moslashadi: …, dass + gap egasi + … + fe'l.","ru":"В придаточном с dass глагол стоит в конце и согласуется с подлежащим: …, dass + подлежащее + … + глагол."},{"uz":"wenn-gapda fe'l oxirida. wenn-gap birinchi kelsa, asosiy gap fe'l bilan boshlanadi: Wenn …, + fe'l + gap egasi …","ru":"В придаточном с wenn глагол в конце. Если wenn-предложение первое, главное начинается с глагола: Wenn …, + глагол + подлежащее …"},{"uz":"Wohin? (harakat: legen, stellen, hängen) → Akkusativ: den / das / die. Wo? (holat: liegen, stehen, hängen) → Dativ: dem / dem / der.","ru":"Wohin? (движение: legen, stellen, hängen) → Akkusativ: den / das / die. Wo? (положение: liegen, stehen, hängen) → Dativ: dem / dem / der."},{"uz":"von (qayerdan?) / bei (qayerda?) / zu (qayerga?) + Dativ: von dem = vom, bei dem = beim, zu dem = zum, zu der = zur. Uy: von zu Hause · zu Hause · nach Hause.","ru":"von (откуда?) / bei (где?) / zu (куда?) + Dativ: von dem = vom, bei dem = beim, zu dem = zum, zu der = zur. Дом: von zu Hause · zu Hause · nach Hause."},{"uz":"Istak (Konjunktiv II): haben → hätte, sein → wäre, boshqa fe'llar → würde + Infinitiv (oxirida). Shaxs: ich/er -e, du -est, wir/sie -en, ihr -et.","ru":"Желание (Konjunktiv II): haben → hätte, sein → wäre, другие глаголы → würde + Infinitiv (в конце). Окончания: ich/er -e, du -est, wir/sie -en, ihr -et."},{"uz":"Otni doim artikl bilan yozing: der (erkak), das (o'rta), die (ayol). Jadvaldagi so'zlardan (Wortblock) foydalaning.","ru":"Существительное всегда пишите с артиклем: der (м.), das (ср.), die (ж.). Используйте слова из Wortblock."},{"uz":"Reaktsiya + dass: «Schade, dass …» (afsus), «Super / Schön, dass …» (xursandlik), «Ich glaube, dass …» (ishonch yo'q). dass-gapda fe'l oxirida.","ru":"Реакция + dass: «Schade, dass …» (жаль), «Super / Schön, dass …» (радость), «Ich glaube, dass …» (не уверен). В dass-части глагол в конце."},{"uz":"Wortverbindung: ot + fe'l birga ishlatiladi (ein Meeting planen). L7–8 so'zlari.","ru":"Wortverbindung: существительное + глагол вместе (ein Meeting planen). Слова L7–8."},{"uz":"Perfekt: haben/sein (2-o'rin) + Partizip II (oxirida). sein — harakat va joy o'zgarishi (fahren, klettern, gehen); qolganlari haben bilan.","ru":"Perfekt: haben/sein (2-е место) + Partizip II (в конце). sein — движение и смена места (fahren, klettern, gehen); остальные с haben."},{"uz":"Präteritum: sein → ich/er war, du warst, wir/sie waren, ihr wart; haben → ich/er hatte, du hattest, wir/sie hatten, ihr hattet.","ru":"Präteritum: sein → ich/er war, du warst, wir/sie waren, ihr wart; haben → ich/er hatte, du hattest, wir/sie hatten, ihr hattet."},{"uz":"letzt- (o'tgan), nächst- (keyingi), jed- (har). Qo'shimcha artiklga mos: der Monat → letzten/nächsten/jeden Monat, das Jahr → -es, die Woche → -e.","ru":"letzt- (прошлый), nächst- (следующий), jed- (каждый). Окончание по роду: der Monat → letzten/nächsten/jeden Monat, das Jahr → -es, die Woche → -e."},{"uz":"weil-gapda fe'l gap oxirida. Modal fe'l eng oxirida (arbeiten muss); Perfektda yordamchi fe'l eng oxirida (repariert hat).","ru":"В придаточном с weil глагол в конце. Модальный — самый последний (arbeiten muss); в Perfekt вспомогательный — самый последний (repariert hat)."},{"uz":"Egalik artikli (unser, euer, ihr, Ihr) «ein» kabi o'zgaradi: Nominativ unser/unsere, Akkusativ unseren (der), Dativ unserem/unserer, Plural Dativ unseren. euer + qo'shimcha → eur- (eure, euren).","ru":"Притяжательный артикль (unser, euer, ihr, Ihr) склоняется как «ein»: Nom. unser/unsere, Akk. unseren (der), Dat. unserem/unserer, Dat. мн. unseren. euer + окончание → eur- (eure, euren)."},{"uz":"über + Akkusativ (… dan ko'p vaqt), seit + Dativ (o'tmishda boshlangan, hali davom etadi), von … bis / vom … bis zum (boshlanish — tugash).","ru":"über + Akkusativ (больше чем …), seit + Dativ (началось в прошлом, длится до сих пор), von … bis / vom … bis zum (начало — конец)."},{"uz":"Maslahat: sollte (sollen ning Konjunktiv II), taklif: könnte (können ning Konjunktiv II). Shaxs: ich/er -e, du -est, wir/sie -en, ihr -et; Infinitiv gap oxirida.","ru":"Совет: sollte (Konjunktiv II от sollen), предложение: könnte (Konjunktiv II от können). Окончания: ich/er -e, du -est, wir/sie -en, ihr -et; Infinitiv в конце."},{"uz":"Bilvosita savol: W-savol → savol so'zi (was, wie lange) + … + fe'l oxirida; Ha/Yo'q-savol → ob + … + fe'l oxirida.","ru":"Косвенный вопрос: W-вопрос → вопросительное слово (was, wie lange) + … + глагол в конце; вопрос да/нет → ob + … + глагол в конце."},{"uz":"Kommunikatsiya: javob savoldagi vaziyatga mos bo'lishi kerak — boshqa vaziyatning iborasi grammatik to'g'ri bo'lsa ham mos kelmaydi.","ru":"Коммуникация: ответ должен подходить к ситуации вопроса — фраза из другой ситуации не подходит, даже если она грамматически верна."},{"uz":"in / vor / nach + Dativ (vaqt): der/das → dem / einem, die → der / einer, Plural → den (+n). in = …dan keyin (kelajak), vor = …dan oldin, nach = …dan keyin.","ru":"in / vor / nach + Dativ (время): der/das → dem / einem, die → der / einer, Plural → den (+n). in = через (будущее), vor = до/перед, nach = после."},{"uz":"Imperativ: du → fe'l o'zagi, -st yo'q, «du» yo'q (Komm! Wasch!); ihr → ihr-shakl, «ihr» yo'q (Macht! Kommt!). Ajraladigan bo'lak oxirida. sein → Sei! / Seid! Oxirida «!».","ru":"Императив: du → основа глагола, без -st и без «du» (Komm! Wasch!); ihr → форма ihr без «ihr» (Macht! Kommt!). Отделяемая приставка в конце. sein → Sei! / Seid! В конце «!»."},{"uz":"Akkusativ olmoshlari: ich → mich, du → dich, er → ihn, es → es, sie → sie, wir → uns, ihr → euch, sie/Sie → sie/Sie. Ot jinsiga qarang: der → ihn, das → es, die → sie.","ru":"Местоимения в Akkusativ: ich → mich, du → dich, er → ihn, es → es, sie → sie, wir → uns, ihr → euch, sie/Sie → sie/Sie. Смотрите на род: der → ihn, das → es, die → sie."},{"uz":"Dativ olmoshlari: ich → mir, du → dir, er/es → ihm, sie → ihr, wir → uns, ihr → euch, sie (Pl.) → ihnen, Sie → Ihnen. gefallen, helfen, danken, gehören, geben + Dativ.","ru":"Местоимения в Dativ: ich → mir, du → dir, er/es → ihm, sie → ihr, wir → uns, ihr → euch, sie (мн.) → ihnen, Sie → Ihnen. gefallen, helfen, danken, gehören, geben + Dativ."},{"uz":"Wo? + Dativ: der/das → dem (in dem = im, an dem = am), die → der, Plural → den (+n).","ru":"Wo? + Dativ: der/das → dem (in dem = im, an dem = am), die → der, мн. ч. → den (+n)."},{"uz":"Otni artikl bilan yozing; ro'yxatdagi (Wortliste) so'zlardan foydalaning.","ru":"Пишите существительное с артиклем; используйте слова из списка (Wortliste)."},{"uz":"Avval olmosh (der → Er, das → Es, die → Sie, gap boshida katta harf), keyin rasmga qarab predlog, keyin Dativ artikli: der/das → dem, die → der, Plural → den.","ru":"Сначала местоимение (der → Er, das → Es, die → Sie, с большой буквы), потом по картинке предлог, потом артикль Dativ: der/das → dem, die → der, мн. ч. → den."},{"uz":"es gibt + Akkusativ: der → einen / keinen, das → ein / kein, die → eine / keine, Plural → (keine) / viele, drei … . Fe'l «gibt» 2-o'rinda, keyin «es».","ru":"es gibt + Akkusativ: der → einen / keinen, das → ein / kein, die → eine / keine, мн. ч. → (keine) / viele, drei … . «gibt» на 2-м месте, потом «es»."},{"uz":"sein (u, erkak) / ihr (u, ayol) — egasiga qarab tanlanadi; qo'shimcha esa narsaga qarab: der (Akk.) → -en, die / Plural → -e, das → qo'shimchasiz. Gap boshida katta harf.","ru":"sein (его) / ihr (её) — по владельцу; окончание — по предмету: der (Akk.) → -en, die / мн. ч. → -e, das → без окончания. В начале — с большой буквы."},{"uz":"werden: ich werde, du wirst, er/sie/es wird, wir werden, ihr werdet, sie/Sie werden.","ru":"werden: ich werde, du wirst, er/sie/es wird, wir werden, ihr werdet, sie/Sie werden."},{"uz":"wollen: ich/er will, du willst, wir/sie wollen, ihr wollt · sollen: ich/er soll, du sollst, wir/sie sollen, ihr sollt.","ru":"wollen: ich/er will, du willst, wir/sie wollen, ihr wollt · sollen: ich/er soll, du sollst, wir/sie sollen, ihr sollt."},{"uz":"Imperativ (Sie): fe'l + Sie + …! Ajraladigan bo'lak oxirida (Stehen Sie auf!).","ru":"Императив (Sie): глагол + Sie + …! Отделяемая приставка в конце (Stehen Sie auf!)."},{"uz":"mit + Dativ (mein → meinem, meine → meiner, Plural → -en), ohne + Akkusativ (sein → seinen, ihre → ihre). Artiklsiz ot (Zucker, Hilfe) — faqat predlog.","ru":"mit + Dativ (mein → meinem, meine → meiner, мн. ч. → -en), ohne + Akkusativ (sein → seinen, ihre → ihre). Без артикля (Zucker, Hilfe) — только предлог."},{"uz":"be-, ge-, er-, ver- bilan boshlangan fe'llar Partizip II da yana «ge-» olmaydi: bekommen → bekommen, erzählen → erzählt.","ru":"Глаголы с be-, ge-, er-, ver- не получают ещё одно «ge-»: bekommen → bekommen, erzählen → erzählt."},{"uz":"un- + sifat → teskari ma'no (glücklich → unglücklich). Bitta so'z, kichik harf.","ru":"un- + прилагательное → противоположное значение (glücklich → unglücklich). Одно слово, с маленькой буквы."},{"uz":"müssen: ich/er/man muss, du musst, wir/sie müssen, ihr müsst · dürfen: ich/er/man darf, du darfst, wir/sie dürfen, ihr dürft.","ru":"müssen: ich/er/man muss, du musst, wir/sie müssen, ihr müsst · dürfen: ich/er/man darf, du darfst, wir/sie dürfen, ihr dürft."},{"uz":"Fe'l qo'shimchalari: ich -e, du -st, er/sie/es -t, wir -en, ihr -t, sie/Sie -en. heißen: du heißt (-t, chunki ß).","ru":"Окончания глаголов: ich -e, du -st, er/sie/es -t, wir -en, ihr -t, sie/Sie -en. heißen: du heißt (-t, т.к. ß)."},{"uz":"sein: ich bin, du bist, er/sie/es ist, wir sind, ihr seid, sie/Sie sind.","ru":"sein: ich bin, du bist, er/sie/es ist, wir sind, ihr seid, sie/Sie sind."},{"uz":"Erkak kishi → er, ayol kishi → sie. Gap boshida katta harf.","ru":"Мужчина → er, женщина → sie. В начале — с большой буквы."},{"uz":"Wer? — kim? (ism) · Wie? — qanday? (ism, ahvol) · Woher? — qayerdan? (davlat).","ru":"Wer? — кто? (имя) · Wie? — как? (имя, дела) · Woher? — откуда? (страна)."},{"uz":"aus + davlat: odatda artiklsiz (aus Spanien); ayol jinsli davlatlar → aus der (Türkei, Schweiz); ko'plik → aus den (USA).","ru":"aus + страна: обычно без артикля (aus Spanien); женского рода → aus der (Türkei, Schweiz); мн. ч. → aus den (USA)."},{"uz":"Darak gap: fe'l 2-o'rinda. W-savol: savol so'zi + fe'l + gap egasi + «?».","ru":"Утверждение: глагол на 2-м месте. W-вопрос: вопросительное слово + глагол + подлежащее + «?»."},{"uz":"Qo'shimchalar: ich -e, du -st, er/sie/es -t, wir -en, ihr -t, sie/Sie -en. arbeiten: o'zak -t bilan tugaydi → du arbeitest, er/ihr arbeitet.","ru":"Окончания: ich -e, du -st, er/sie/es -t, wir -en, ihr -t, sie/Sie -en. arbeiten: основа на -t → du arbeitest, er/ihr arbeitet."},{"uz":"haben: ich habe, du hast, er/sie hat, wir haben, ihr habt, sie haben · sein: ich bin, du bist, er/sie ist, wir sind, ihr seid, sie sind. Yosh, kasb, oilaviy holat → sein; bolalar, ish → haben.","ru":"haben: ich habe, du hast, er/sie hat, wir haben, ihr habt, sie haben · sein: ich bin, du bist, er/sie ist, wir sind, ihr seid, sie sind. Возраст, профессия, семейное положение → sein; дети, работа → haben."},{"uz":"in + shahar (qayerda yashaydi) · als + kasb (kim bo'lib ishlaydi) · bei + firma/joy (qayerda ishlaydi).","ru":"in + город (где живёт) · als + профессия (кем работает) · bei + фирма/место (где работает)."},{"uz":"Ayol shakli: + -in (der Lehrer → die Lehrerin). Ba'zan umlaut: der Arzt → die Ärztin.","ru":"Женская форма: + -in (der Lehrer → die Lehrerin). Иногда умлаут: der Arzt → die Ärztin."},{"uz":"nicht — inkor qilinadigan so'z oldida turadi; fe'l 2-o'rinda qoladi.","ru":"nicht стоит перед тем, что отрицается; глагол остаётся на 2-м месте."},{"uz":"Har bir otning artikli bor: der (erkak), das (o'rta), die (ayol). Artiklni so'z bilan birga yodlang.","ru":"У каждого существительного есть артикль: der (м.), das (ср.), die (ж.). Учите артикль вместе со словом."},{"uz":"Ot takrorlanmasa: der → er, das → es, die → sie. Gap boshida katta harf.","ru":"Чтобы не повторять существительное: der → er, das → es, die → sie. В начале — с большой буквы."},{"uz":"Ko'plik shakli qavsda: (-e) → + e, (¨e) → umlaut + e, (-s) → + s, (¨er) → umlaut + er, (-n) → + n, (-) → o'zgarmaydi.","ru":"Форма мн. ч. в скобках: (-e) → + e, (¨e) → умлаут + e, (-s) → + s, (¨er) → умлаут + er, (-n) → + n, (-) → без изменений."},{"uz":"Akkusativ (haben, brauchen, suchen, finden, sehen …): faqat der o'zgaradi → den / einen / keinen. das, die, Plural o'zgarmaydi.","ru":"Akkusativ (haben, brauchen, suchen, finden, sehen …): меняется только der → den / einen / keinen. das, die, мн. ч. не меняются."},{"uz":"Sonlar: birlik + und + o'nlik, bitta so'z: 21 = einundzwanzig, 37 = siebenunddreißig. 100 = (ein)hundert, 1000 = (ein)tausend.","ru":"Числа: единицы + und + десятки, одним словом: 21 = einundzwanzig, 37 = siebenunddreißig. 100 = (ein)hundert, 1000 = (ein)tausend."},{"uz":"mein / dein: der, das → mein / dein; die, Plural → meine / deine.","ru":"mein / dein: der, das → mein / dein; die, мн. ч. → meine / deine."},{"uz":"Ja — tasdiq savolga «ha». Nein — «yo'q». Doch — inkor savolga (nicht / kein) «ha» javobi.","ru":"Ja — «да» на обычный вопрос. Nein — «нет». Doch — «да» на отрицательный вопрос (nicht / kein)."},{"uz":"sprechen: ich spreche, du sprichst, er/sie spricht, wir sprechen, ihr sprecht, sie sprechen (e → i faqat du va er/sie).","ru":"sprechen: ich spreche, du sprichst, er/sie spricht, wir sprechen, ihr sprecht, sie sprechen (e → i только у du и er/sie)."},{"uz":"Ism + s: der Vater von Anna → Annas Vater (apostrofsiz).","ru":"Имя + s: der Vater von Anna → Annas Vater (без апострофа)."},{"uz":"ein — der va das so'zlar uchun, eine — die so'zlar uchun.","ru":"ein — для der и das, eine — для die."},{"uz":"kein / keine — ot oldidan (ein/eine o'rniga yoki artiklsiz ot); nicht — sifat yoki boshqa so'z oldidan.","ru":"kein / keine — перед существительным (вместо ein/eine или без артикля); nicht — перед прилагательным и другими словами."},{"uz":"sehen: ich sehe, du siehst, er/sie sieht, wir sehen, ihr seht, sie sehen.","ru":"sehen: ich sehe, du siehst, er/sie sieht, wir sehen, ihr seht, sie sehen."},{"uz":"Material: … ist aus + material (artiklsiz): aus Glas, aus Metall.","ru":"Материал: … ist aus + материал (без артикля): aus Glas, aus Metall."},{"uz":"können: ich/er kann, du kannst, wir/sie können, ihr könnt. Infinitiv gap oxirida (Satzklammer).","ru":"können: ich/er kann, du kannst, wir/sie können, ihr könnt. Infinitiv в конце (Satzklammer)."},{"uz":"Unli o'zgarishi faqat du va er/sie da: fahren → fährst/fährt, lesen → liest, treffen → triffst/trifft, essen → isst, nehmen → nimmst/nimmt.","ru":"Смена гласной только у du и er/sie: fahren → fährst/fährt, lesen → liest, treffen → triffst/trifft, essen → isst, nehmen → nimmst/nimmt."},{"uz":"am + kun / kun qismi (am Freitag, am Abend, am Wochenende); um + soat (um 7 Uhr, um halb drei).","ru":"am + день / часть дня (am Freitag, am Abend, am Wochenende); um + время (um 7 Uhr, um halb drei)."},{"uz":"halb zehn = 9:30 (o'ndan yarim oldin), Viertel nach = :15, Viertel vor = :45, zehn nach = :10.","ru":"halb zehn = 9:30 (половина десятого), Viertel nach = :15, Viertel vor = :45, zehn nach = :10."},{"uz":"Fe'l doim 2-o'rinda: belgilangan so'z 1-o'rinda bo'lsa, gap egasi fe'ldan keyin keladi.","ru":"Глагол всегда на 2-м месте: если на 1-м выделенное слово, подлежащее идёт после глагола."},{"uz":"mögen: ich/er mag, du magst, wir/sie mögen, ihr mögt · möchte: ich/er möchte, du möchtest, wir/sie/Sie möchten, ihr möchtet.","ru":"mögen: ich/er mag, du magst, wir/sie mögen, ihr mögt · möchte: ich/er möchte, du möchtest, wir/sie/Sie möchten, ihr möchtet."},{"uz":"Ot + ot = bitta so'z; artikl ikkinchi (asosiy) otdan olinadi; ba'zan -n qo'shiladi (Tomatensuppe).","ru":"Сущ. + сущ. = одно слово; артикль — от второго (главного) существительного; иногда добавляется -n (Tomatensuppe)."},{"uz":"Ajraladigan fe'l: o'zak 2-o'rinda, prefiks (ab, an, um, ein, fern, aus) gap oxirida. Modal fe'l bilan — birga, oxirida (abholen).","ru":"Отделяемый глагол: основа на 2-м месте, приставка (ab, an, um, ein, fern, aus) в конце. С модальным — слитно, в конце (abholen)."},{"uz":"Perfekt haben bilan: haben (2-o'rin) + Partizip II (oxirida). Partizip: ge-…-t (muntazam), ge-…-en (nomuntazam), -ieren → -iert, ajraladigan → auf·ge·räumt.","ru":"Perfekt с haben: haben (2-е место) + Partizip II (в конце). Partizip: ge-…-t (правильные), ge-…-en (неправильные), -ieren → -iert, отделяемые → auf·ge·räumt."},{"uz":"Perfekt sein bilan: harakat / joy o'zgarishi (fahren, gehen, fliegen, kommen) va bleiben. Qolganlari — haben.","ru":"Perfekt с sein: движение / смена места (fahren, gehen, fliegen, kommen) и bleiben. Остальные — haben."},{"uz":"Ayol shakli: + -in (der Lehrer → die Lehrerin); der Arzt → die Ärztin (umlaut).","ru":"Женская форма: + -in (der Lehrer → die Lehrerin); der Arzt → die Ärztin (умлаут)."},{"uz":"Birlik + und + o'nlik, bitta so'z: 29 = neunundzwanzig.","ru":"Единицы + und + десятки, одним словом: 29 = neunundzwanzig."},{"uz":"du — do'stlarga, Sie — hurmat bilan. Gap boshida katta harf.","ru":"du — друзьям, Sie — вежливо. В начале предложения — с большой буквы."},{"uz":"ich -e, du -st, er/sie -t, wir -en, ihr -t, sie/Sie -en · sein: bin, bist, ist, sind, seid · haben: habe, hast, hat · arbeiten: er arbeitet.","ru":"ich -e, du -st, er/sie -t, wir -en, ihr -t, sie/Sie -en · sein: bin, bist, ist, sind, seid · haben: habe, hast, hat · arbeiten: er arbeitet."},{"uz":"Darak gap: fe'l 2-o'rinda. W-savol: savol so'zi + fe'l + gap egasi. Ha/Yo'q-savol: fe'l boshida. nicht — inkor qilinadigan so'z oldida.","ru":"Утверждение: глагол на 2-м месте. W-вопрос: вопр. слово + глагол + подлежащее. Вопрос да/нет: глагол в начале. nicht — перед отрицаемым."},{"uz":"Matnni qayta o'qing: har bir gapdagi ma'lumotni uchala odam bilan solishtiring.","ru":"Перечитайте тексты: сравните информацию с каждым из трёх человек."},{"uz":"Har bir otning artiklini so'z bilan birga yodlang: der (erkak), das (o'rta), die (ayol).","ru":"Учите артикль вместе со словом: der (м.), das (ср.), die (ж.)."},{"uz":"Qarama-qarshi ma'noli sifat (L4–5).","ru":"Прилагательное с противоположным значением (L4–5)."},{"uz":"ein — der/das, eine — die; inkor: kein / keine. Ko'plikda: keine (ein yo'q).","ru":"ein — der/das, eine — die; отрицание: kein / keine. Во мн. ч.: keine (ein нет)."},{"uz":"Akkusativ (haben, brauchen, suchen …): faqat der o'zgaradi → den / einen / keinen. das, die o'zgarmaydi. «Wo ist …?» — Nominativ.","ru":"Akkusativ (haben, brauchen, suchen …): меняется только der → den / einen / keinen. das, die не меняются. «Wo ist …?» — Nominativ."},{"uz":"Ko'plik shaklini so'z bilan birga yodlang: -e, ¨e, -er, -(e)n, -s yoki o'zgarmaydi.","ru":"Учите форму мн. ч. вместе со словом: -e, ¨e, -er, -(e)n, -s или без изменений."},{"uz":"Har bir vaziyatga bitta ibora mos keladi; har harf bir marta.","ru":"Каждой ситуации подходит одна фраза; каждая буква — один раз."},{"uz":"Faqat e'londagi ma'lumotga qarang: kim sotadi / kim qidiradi, material, rang, narx.","ru":"Смотрите только на объявление: кто продаёт / кто ищет, материал, цвет, цена."}],"A2.2-Lektion-13---Grammatika-Dativ-und-Akkusativ":{"t":{"pn":{"uz":"Bitta olmosh + bitta ot: qisqasi oldin — olmosh otdan oldin keladi.","ru":"Одно местоимение + одно существительное: короткое раньше — местоимение стоит перед существительным."},"pp":{"uz":"Ikkita olmosh: tartib Akkusativ → Dativ. Qaysi biri «nimani?», qaysi biri «kimga?» javob beradi?","ru":"Два местоимения: порядок Akkusativ → Dativ. Какое отвечает на «что?», какое на «кому?»"},"nn":{"uz":"Ikkita ot: tartib Dativ → Akkusativ (avval «kimga?», keyin «nimani?»).","ru":"Два существительных: порядок Dativ → Akkusativ (сначала «кому?», потом «что?»)."},"a1":{"uz":"Akkusativ olmoshi otning jinsiga mos: der → ihn, das → es, die / Plural → sie. «der Löffel» — qaysi jins?","ru":"Местоимение в Akkusativ по роду: der → ihn, das → es, die / Plural → sie. «der Löffel» — какой род?"},"a2":{"uz":"Akkusativ olmoshi otning jinsiga mos: der → ihn, das → es, die / Plural → sie. «das Öl» — qaysi jins?","ru":"Местоимение в Akkusativ по роду: der → ihn, das → es, die / Plural → sie. «das Öl» — какой род?"},"a3":{"uz":"Akkusativ olmoshi otning jinsiga mos: der → ihn, das → es, die / Plural → sie. «die Schüssel» — qaysi jins?","ru":"Местоимение в Akkusativ по роду: der → ihn, das → es, die / Plural → sie. «die Schüssel» — какой род?"},"a4":{"uz":"Akkusativ olmoshi otning jinsiga mos: der → ihn, das → es, die / Plural → sie. «die Gläser» — birlikmi, ko'plikmi?","ru":"Местоимение в Akkusativ по роду: der → ihn, das → es, die / Plural → sie. «die Gläser» — единственное или множественное?"},"d1":{"uz":"Dativ olmoshlari: mir · dir · ihm · ihr · uns · euch · ihnen. «unserer Oma» — bitta ayol kishi.","ru":"Местоимения в Dativ: mir · dir · ihm · ihr · uns · euch · ihnen. «unserer Oma» — одна женщина."},"d2":{"uz":"Dativ olmoshlari: mir · dir · ihm · ihr · uns · euch · ihnen. «deinem Bruder» — bitta erkak kishi.","ru":"Местоимения в Dativ: mir · dir · ihm · ihr · uns · euch · ihnen. «deinem Bruder» — один мужчина."},"d3":{"uz":"Dativ olmoshlari: mir · dir · ihm · ihr · uns · euch · ihnen. «mir und meinem Freund» = men + u → «biz».","ru":"Местоимения в Dativ: mir · dir · ihm · ihr · uns · euch · ihnen. «mir und meinem Freund» = я at -en.","ru":"«mit» + Dativ, множественное: артикль den, прилагательное -en.","r":0},"b4":{"uz":"«finden» + Akkusativ, «der Eingang» — erkak jinsi.","ru":"«finden» + Akkusativ, «der Eingang» — мужской род.","r":0},"b5":{"uz":"«auf» + «qayerda?» → Dativ, «der Hof».","ru":"«auf» + «где?» → Dativ, «der Hof».","r":0},"b6":{"uz":"Gap egasi (Nominativ), «das Treppenhaus». Gap boshida — katta harf.","ru":"Подлежащее (Nominativ), «das Treppenhaus». В начале — с большой буквы.","r":0},"b7":{"uz":"«mit» + Dativ, «die Nachbarin» — ayol jinsi.","ru":"«mit» + Dativ, «die Nachbarin» — женский род.","r":0},"b8":{"uz":"«stellen» + «qayerga?» → Akkusativ, «der Keller».","ru":"«stellen» + «куда?» → Akkusativ, «der Keller».","r":0},"b9":{"uz":"Gap egasi, ko'plik (Plural). Gap boshida — katta harf.","ru":"Подлежащее во множественном числе. В начале — с большой буквы.","r":0},"b10":{"uz":"«sehen» + Akkusativ, «die Garage» — ayol jinsi.","ru":"«sehen» + Akkusativ, «die Garage» — женский род.","r":0}},"m":["nom","nom","datin","akkf","akkm","im","nom","am","pl","akkn","b1","b2","b3","b4","b5","b6","b7","b8","b9","b10"]},"A2.2-Lektion-14---Laufdiktat-Chaos-Saetze-L13":{"t":{"ws":{"uz":"Fe'l 2-o'rinda. Ikki ot: avval Dativ («kimga?»), keyin Akkusativ («nimani?»). Gap katta harf bilan boshlanib, nuqta bilan tugaydi.","ru":"Глагол на 2-м месте. Два существительных: сначала Dativ («кому?»), потом Akkusativ («что?»). Предложение с большой буквы и с точкой."},"ws2":{"uz":"«mitbringen» — ajraladigan fe'l: «bringe» 2-o'rinda, «mit» gap oxirida. Avval Dativ («kimga?»), keyin Akkusativ.","ru":"«mitbringen» — отделяемый глагол: «bringe» на 2-м месте, «mit» в конце. Сначала Dativ («кому?»), потом Akkusativ."}},"m":["ws","ws","ws2","ws","ws","ws","ws","ws"]},"A2.2-Lektion-15---Arbeitsblatt-Adjektive-nach-ein-kein-mein":{"t":{"0":{"uz":"«Das ist ein …» → Nominativ. «der Tag» — erkak jinsi.","ru":"«Das ist ein …» → Nominativ. «der Tag» — мужской род.","r":1},"1":{"uz":"«tragen» + Akkusativ. «das Hemd» — function hwBlock(tab){
  const mine = HW.filter(h=>!h.tab || h.tab===tab);
  const active = mine.filter(h=>!h.due || dDiff(h.due)>=0).sort((a,b)=>(a.due||"9").localeCompare(b.due||"9"));
  const old = mine.filter(h=>h.due && dDiff(h.due)<0).sort((a,b)=>b.due.localeCompare(a.due));
  return `<section class="hw" id="hw"><div class="hw-h"><h2>${t("hw")}</h2><span class="hw-when">${TABS[tab].lbl}</span></div>
    ${active.length? active.map(hwEntry).join("") : `<p class="hw-empty">${t("hwEmpty")}</p>`}
    ${old.length?`<details class="hw-old" id="hw-old"><summary>${t("hwOld")} (${old.length})</summary>${old.map(hwEntry).join("")}</details>`:""}
  </section>`;
}
function lekHw(tab,n){
  const hs = HW.filter(h=>h.tab===tab && h.lektion===n); if(!hs.length) return "";
  return `<div class="lek-hw"><b>${t("hwLekShort")}</b>${hs.map(h=>`<div><span class="d">${fmtDate(h.date)}${h.due?` → ${fmtDate(h.due)}`:""}${h.group?` · ${esc(h.group)}`:""}</span>${h.title?`<div>${esc(tx(h.title))}</div>`:""}${h.items.length?`<ul>${h.items.map(it=>`<li>${esc(tx(it))}${lnk(it)}</li>`).join("")}</ul>`:""}</div>`).join("")}</div>`;
}
const flat = v => v&&typeof v==="object" ? [v.text||"",v.uz||"",v.ru||""] : [v||""];
function lekText(L,tab){ const mats=MATS.filter(m=>m.tab===tab && m.key===String(L[0])); return norm([TABS[tab].lbl, "lektion "+L[0], "l"+L[0], ...L.slice(1).map(String), ...mats.map(m=>m.title), ...HW.filter(h=>h.tab===tab && h.lektion===L[0]).flatMap(h=>[h.title,...h.items].flatMap(flat))].join(" ")); }
const allLessons = () => Object.keys(TABS).flatMap(tab=>LEKS[TABS[tab].lvl].filter(L=>L[0]>=TABS[tab].lo && L[0]<=TABS[tab].hi).map(L=>[L,tab]));

function render(){
  document.documentElement.lang = state.lang==="uz"?"uz":"ru";
  document.querySelectorAll("[data-i]").forEach(el=>el.innerHTML=t(el.dataset.i));
  document.getElementById("q").placeholder = t("search");
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.lang===state.lang));
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected", b.dataset.tab===state.tab && !state.q));
  const types=[["all",""],["grammatik","var(--blue)"],["wortschatz","var(--orange)"],["sprechen","var(--green)"]];
  document.getElementById("chips").innerHTML = types.map(([k,c])=>`<button class="chip" data-type="${k}" aria-pressed="${state.type===k}">${c?`<span class="dot" style="background:${c}"></span>`:""}${t(k)}</button>`).join("");

  let html="";
  const q = norm(state.q.trim());
  if(q){
    const num = q.match(/^l?(?:ektion\s*)?(\d{1,2})$/);
    const hits = allLessons().filter(([L,tab]) => num ? L[0]===+num[1] : lekText(L,tab).includes(q));
    const listHits = MATS.filter(m=>m.tab==="list" && matchType(m) && norm(m.lvl+" "+m.title).includes(q));
    html += `<div class="sec-h"><h2>${t("results")}</h2></div>`;
    if(listHits.length) html += `<div class="mats">${listHits.map(matCard).join("")}</div>`;
    html += hits.map(([L,tab])=>lekCard(L,tab,true)).join("");
    if(!hits.length && !listHits.length) html += `<div class="empty-state">${t("noRes")}</div>`;
    main.innerHTML = html; return;
  }

  if(state.tab!=="list"){
    const tab = state.tab, T0 = TABS[tab], LS = LEKS[T0.lvl], CUR = CURS[tab];
    if(state.type==="all") html += hwBlock(tab);
    const rv = visibleMats(tab,"r");
    if(rv.length) html += `<div class="review rv-top"><h4>${t("whole")} · ${T0.lbl} · L${T0.lo}–${T0.hi}</h4><div class="mats">${rv.map(matCard).join("")}</div></div>`;
    const modHtml = (md, onlyN, asc) => {
      const ls = LS.filter(L=>Math.ceil(L[0]/3)===md);
      const rev = visibleMats(tab,"m"+md);
      const cards = ls.filter(L=>onlyN(L[0]) && (state.type==="all"||visibleMats(tab,L[0]).length));
      if(!asc) cards.reverse();
      const showRev = rev.length && onlyN(ls[2][0]);
      if(!cards.length && !showRev) return "";
      let h = `<section class="modul"><div class="modul-h"><span class="tag">${t("modul")} ${md} · L${ls[0][0]}–${ls[2][0]}</span><span class="rule"></span></div>`;
      const blocks = cards.map(L=>({d:keyDate(tab,L[0]), n:L[0], h:lekCard(L,tab)}));
      if(showRev) blocks.push({d:keyDate(tab,"m"+md), n:ls[2][0]+.5, h:`<div class="review">${CURKEY[tab]==="m"+md?`<span class="cur">${t("cur")}</span>`:""}<h4>${t("review")} · L${ls[0][0]}–${ls[2][0]}</h4><div class="mats">${rev.map(matCard).join("")}</div></div>`});
      if(!asc){ const ck=CURKEY[tab]; const isCur=b=>ck!=null && (/^m/.test(ck) ? b.n===+ck.slice(1)*3+.5 : b.n===+ck);
        blocks.sort((a,b)=>(isCur(b)-isCur(a)) || b.n-a.n); }
      h += blocks.map(b=>b.h).join("");
      return h + `</section>`;
    };
    const mods = []; for(let md=Math.ceil(T0.lo/3); md<=Math.ceil(T0.hi/3); md++) mods.push(md);
    if(CUR){
      const ck=CURKEY[tab], ckMod = ck==null ? null : (/^m/.test(ck) ? +ck.slice(1) : Math.ceil(+ck/3));
      for(const md of mods.slice().sort((a,b)=>((b===ckMod)-(a===ckMod)) || b-a)) html += modHtml(md, n=>n<=CUR);
      const later = mods.map(md=>modHtml(md, n=>n>CUR, true)).join("");
      if(later) html += `<details class="later" id="later"><summary>${t("later")} · L${CUR+1}–${T0.hi}</summary>${later}</details>`;
    } else {
      for(const md of mods) html += modHtml(md, ()=>true, true);
    }
    if(!html) html = `<div class="empty-state">${t("noRes")}</div>`;
  } else {
    for(const lvl of ["A1","A2"]){
      const ls = MATS.filter(m=>m.tab==="list" && m.lvl===lvl && matchType(m));
      if(!ls.length) continue;
      html += `<div class="sec-h"><h2>${t("listsH")} ${lvl}</h2><small>${t("listsSub")}</small></div><div class="mats">${ls.map(matCard).join("")}</div>`;
    }
    if(!html) html = `<div class="empty-state">${t("noRes")}</div>`;
  }
  main.innerHTML = html;
}

/* viewer (pdf.js, loaded on first use) */
const V = {el:document.getElementById("viewer"), body:document.getElementById("v-body"), title:document.getElementById("v-title"),
  sol:document.getElementById("v-sol"), dl:document.getElementById("v-dl"), cur:null, token:0, lastFocus:null};
let pdfReady=null, downloads=null;
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s);});}
function ensurePdf(){
  if(!pdfReady){
    const base="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
    pdfReady = loadScript(base+"pdf.min.js").then(()=>loadScript(base+"pdf.worker.min.js")).then(()=>{
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = base+"pdf.worker.min.js"; return window.pdfjsLib;});
    pdfReady.catch(()=>{pdfReady=null;});
  }
  return pdfReady;
}
async function openViewer(m){
  if(!m) return;
  V.cur=m; const my=++V.token;
  if(V.el.hidden) V.lastFocus=document.activeElement;
  V.el.hidden=false; document.body.style.overflow="hidden";
  const where = m.tab==="list" ? m.lvl : TABS[m.tab].lbl + (/^\d+$/.test(m.key)?` · ${t("lek")} ${m.key}`:"");
  const parent = m.solOf?byId[m.solOf]:null;
  V.title.innerHTML = `${esc(parent?parent.title+" — "+t("sol"):m.title)}<small>${esc(where)} · ${m.pages} ${t("pages")}</small>`;
  const sol = solFor[m.id];
  V.sol.hidden = !(sol||parent);
  V.sol.textContent = sol? t("sol") : (parent? "← "+t("open"):"");
  V.sol.onclick = ()=>openViewer(sol||parent);
  V.dl.hidden = false;
  { const va=document.getElementById("v-audio"), au=document.getElementById("v-aud");
    if(m.audio){ if(au.dataset.src!==m.audio){ au.pause(); au.removeAttribute("src"); au.dataset.src=m.audio; audAttach(au, m.audio, document.getElementById("v-audst")); } va.hidden=false; }
    else { au.pause(); va.hidden=true; } }
  iaOpen(m.id);
  V.body.innerHTML = `<div class="v-msg">${t("loading")}</div>`;
  document.getElementById("v-close").focus();
  try{
    const [lib, buf] = await Promise.all([ensurePdf(), fetch(m.file).then(r=>{if(!r.ok)throw 0; return r.arrayBuffer();})]);
    if(my!==V.token) return;
    const doc = await lib.getDocument({data:new Uint8Array(buf)}).promise; V.doc=doc; V.hi={};
    if(my!==V.token) return;
    await renderPages(m, my);
  }catch(err){ if(my===V.token) V.body.innerHTML=`<div class="v-msg">${t("err")}</div>`; }
}
/* PDF'ni kattalashtirish (−/+), 2026-10-16 */
const ZOOMS=Array.from({length:24},(_,k)=>Math.round((0.7+k*0.1)*10)/10); /* 70% … 300%, har bosish 10% */
V.zoom = (()=>{ const z=+store.get("vzoom"); return ZOOMS.includes(z)?z:1; })();
function zoomLabel(){ document.getElementById("v-zv").textContent=Math.round(V.zoom*100)+"%"; document.getElementById("v-zout").disabled=V.zoom<=ZOOMS[0]; document.getElementById("v-zin").disabled=V.zoom>=ZOOMS[ZOOMS.length-1]; }
async function renderPages(m, my){
  const doc=V.doc; if(!doc) return;
  const trp=document.getElementById("tr-panel"); if(trp) trp.remove();
  V.body.innerHTML=""; V.body.classList.toggle("zoomed", V.zoom>1); zoomLabel();
  const base = Math.min(V.body.clientWidth-24, 900), w = Math.round(base*V.zoom);
  for(let i=1;i<=doc.numPages;i++){
    const page = await doc.getPage(i); if(my!==V.token) return;
    const vp0 = page.getViewport({scale:1}); const scale = w/vp0.width;
    let dpr=Math.min(window.devicePixelRatio||1,2.5); while(dpr>1 && (vp0.width*scale*dpr)*(vp0.height*scale*dpr)>14e6) dpr*=0.85;
    const vp = page.getViewport({scale:scale*dpr});
    const c=document.createElement("canvas"); c.width=Math.floor(vp.width); c.height=Math.floor(vp.height); c.style.width=Math.round(vp.width/dpr)+"px";
    c.setAttribute("aria-label", `${m.title} — ${i}/${doc.numPages}`);
    const pgw=document.createElement("div"); pgw.className="pg"; pgw.dataset.p=i-1; pgw.style.width=c.style.width; pgw.appendChild(c);
    V.body.appendChild(pgw); if(IA.on && IA.id===m.id) iaMountPage(pgw);
    await page.render({canvasContext:c.getContext("2d"), viewport:vp}).promise;
  }
  if(trp && my===V.token) V.body.appendChild(trp);
}
async function setZoom(dir){
  const k=ZOOMS.indexOf(V.zoom), nk=Math.max(0,Math.min(ZOOMS.length-1,k+dir)); if(nk===k||!V.doc||!V.cur) return;
  const b=V.body, ry=b.scrollHeight? (b.scrollTop+b.clientHeight/2)/b.scrollHeight : 0, rx=b.scrollWidth? (b.scrollLeft+b.clientWidth/2)/b.scrollWidth : .5;
  V.zoom=ZOOMS[nk]; store.set("vzoom",String(V.zoom));
  const my=++V.token; await renderPages(V.cur,my);
  if(my!==V.token) return;
  b.scrollTop=Math.max(0, ry*b.scrollHeight-b.clientHeight/2); b.scrollLeft=Math.max(0, rx*b.scrollWidth-b.clientWidth/2);
}
document.getElementById("v-zin").addEventListener("click",()=>setZoom(1));
document.getElementById("v-zout").addEventListener("click",()=>setZoom(-1));

/* Natija kartochkasi (rasm) — ulashish uchun. 2026-10-16 */
function cardPraise(p){ return p>=100?"Perfekt!":p>=90?"Ausgezeichnet!":p>=75?"Sehr gut!":p>=50?"Gut gemacht!":"Weiter so!"; }
function cardWrap(c,text,maxW){ const words=String(text).split(" "), lines=[]; let cur=""; for(const w of words){ const tst=cur?cur+" "+w:w; if(c.measureText(tst).width>maxW&&cur){ lines.push(cur); cur=w; } else cur=tst; } if(cur) lines.push(cur); return lines; }
function cardDraw(name){
  const W=1080,H=1350, cv=document.createElement("canvas"); cv.width=W; cv.height=H; const c=cv.getContext("2d");
  const HAND='"Patrick Hand", "Comic Sans MS", cursive', SANS='Figtree, system-ui, -apple-system, sans-serif';
  const pct=SND.n?Math.round(SND.ok/SND.n*100):0;
  const g=c.createLinearGradient(0,0,W,H); g.addColorStop(0,"#1F4FA0"); g.addColorStop(1,"#12305F"); c.fillStyle=g; c.fillRect(0,0,W,H);
  c.globalAlpha=.07; c.fillStyle="#fff"; c.beginPath(); c.arc(W-80,120,260,0,7); c.fill(); c.beginPath(); c.arc(60,H-80,200,0,7); c.fill(); c.globalAlpha=1;
  c.textAlign="center"; c.textBaseline="alphabetic";
  c.fillStyle="rgba(255,255,255,.75)"; c.font=`600 34px ${SANS}`; c.fillText(("DEUTSCH  ·  "+(SND.lvl||"")).toUpperCase().replace(/\s·\s$/,""),W/2,110);
  c.font=`120px ${SANS}`; c.fillText("🏆",W/2,260);
  let y=370;
  if(name){ c.fillStyle="#fff"; c.font=`92px ${HAND}`; cardWrap(c,name,W-160).slice(0,2).forEach(l=>{ c.fillText(l,W/2,y); y+=96; }); y+=6; }
  c.fillStyle="rgba(255,255,255,.88)"; c.font=`500 42px ${SANS}`; cardWrap(c,SND.title,W-180).slice(0,3).forEach(l=>{ c.fillText(l,W/2,y); y+=54; });
  if(SND.where){ c.fillStyle="rgba(255,255,255,.6)"; c.font=`500 34px ${SANS}`; c.fillText(SND.where,W/2,y+4); }
  const cy=Math.max(y+250, 860), r=190;
  c.lineWidth=34; c.lineCap="round"; c.strokeStyle="rgba(255,255,255,.15)"; c.beginPath(); c.arc(W/2,cy,r,0,Math.PI*2); c.stroke();
  c.strokeStyle=pct>=75?"#7EE2A8":pct>=50?"#FFD166":"#FF9F7A"; c.beginPath(); c.arc(W/2,cy,r,-Math.PI/2,-Math.PI/2+Math.PI*2*Math.max(pct,1)/100); c.stroke();
  c.fillStyle="#fff"; let fs=124; const sc=`${SND.ok}/${SND.n}`; do{ c.font=`700 ${fs}px ${SANS}`; fs-=4; }while(c.measureText(sc).width>r*1.55 && fs>50); c.fillText(sc,W/2,cy+30);
  c.fillStyle="rgba(255,255,255,.7)"; c.font=`600 44px ${SANS}`; c.fillText(pct+"%",W/2,cy+96);
  c.fillStyle="#FFD166"; c.font=`88px ${HAND}`; c.fillText(cardPraise(pct),W/2,cy+r+120);
  const d=new Date(), p2=x=>String(x).padStart(2,"0");
  c.font=`500 30px ${SANS}`; c.fillStyle="rgba(255,255,255,.6)"; c.textAlign="left"; c.fillText(`${p2(d.getDate())}.${p2(d.getMonth()+1)}.${d.getFullYear()}`,70,H-60);
  c.textAlign="right"; c.font=`36px ${HAND}`; c.fillStyle="rgba(255,255,255,.8)"; c.fillText("Otabek Komilov",W-70,H-58);
  return cv;
}
let cardBlob=null, cardTimer=null, cardSeq=0;
async function cardRender(){
  const f=document.getElementById("snd-f"), img=f.querySelector(".snd-img"); if(!img) return;
  const my=++cardSeq; try{ await Promise.all(['92px "Patrick Hand"','700 100px Figtree','600 40px Figtree','500 40px Figtree'].map(x=>document.fonts.load(x))); }catch(e){}

  const cv=cardDraw(name); img.src=cv.toDataURL("image/png");
  cardBlob=null; cv.toBlob(b=>{ if(my===cardSeq) cardBlob=b; },"image/png");
}

/* Audio: butun faylni blob qilib yuklaymiz — iOS Safari artifact serverida davomiylikni ko'rmay "Live-Übertragung" deb ko'rsatardi (2026-10-17) */
const AUD={};
function audFetch(url, onp){
  if(AUD[url]&&AUD[url].url) return Promise.resolve(AUD[url].url);
  if(AUD[url]&&AUD[url].p){ if(onp) AUD[url].cbs.push(onp); return AUD[url].p; }
  const rec=AUD[url]={cbs:onp?[onp]:[]};
  rec.p=(async()=>{
    const r=await fetch(url); if(!r.ok) throw new Error("http "+r.status);
    const total=+r.headers.get("content-length")||0; let blob;
    if(r.body&&r.body.getReader&&total){ const rd=r.body.getReader(), parts=[]; let got=0;
      for(;;){ const {done,value}=await rd.read(); if(done) break; parts.push(value); got+=value.length; rec.cbs.forEach(f=>f(Math.min(99,Math.round(got/total*100)))); }
      blob=new Blob(parts,{type:"audio/mpeg"}); }
    else blob=new Blob([await r.arrayBuffer()],{type:"audio/mpeg"});
    rec.url=URL.createObjectURL(blob); return rec.url;
  })().catch(e=>{ delete AUD[url]; throw e; });
  return rec.p;
}

/* "Nega xato?" — javobni ochmasdan: avtomatik xato turi + Lektion qoidasi (2026-10-15, Otabek) */
const HINTS = (()=>{ try{ return JSON.parse(document.getElementById("hint-data").textContent)||{}; }catch(e){ return {}; } })();
const W_ART = new Set("der die das den dem des ein eine einen einem einer eines kein keine keinen keinem keiner keines mein meine meinen meinem meiner meines dein deine deinen deinem deiner sein seine seinen seinem seiner ihr ihre ihren ihrem ihrer unser unsere unseren unserem unserer euer eure euren eurem eurer".split(" "));
function lev(a,b){ const m=a.length,n=b.length; if(!m) return n; if(!n) return m; let p=[...Array(n+1).keys()];
  for(let i=1;i<=m;i++){ const c=[i]; for(let j=1;j<=n;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=c; } return p[n]; }
const deUml = x => x.replace(/ä/g,"a").replace(/ö/g,"o").replace(/ü/g,"u").replace(/ß/g,"ss");
function iaAuto(it, raw){
  const v=iaNorm(raw||""); if(!v) return "wEmpty";
  const alts=(it.ok||[]).filter(Boolean); if(!alts.length) return null;
  const best=alts.map(a=>[a,lev(v,a)]).sort((x,y)=>x[1]-y[1])[0][0];
  if(deUml(v)===deUml(best) || deUml(v).replace(/ae/g,"a").replace(/oe/g,"o").replace(/ue/g,"u")===deUml(best)) return "wU";
  if(v.replace(/[\s'-]/g,"")===best.replace(/[\s'-]/g,"")) return "wP";
  const vw=v.split(" "), bw=best.split(" ");
  if(vw.length>1 && vw.length===bw.length && vw.slice().sort().join(" ")===bw.slice().sort().join(" ")) return "wO";
  if(vw.length===bw.length){
    const diff=vw.map((w,k)=>[w,bw[k]]).filter(([x,y])=>x!==y);
    if(diff.length===1){ const [x,y]=diff[0];
      if(W_ART.has(x)&&W_ART.has(y)) return "wA";
      let c=0; while(c<x.length&&c<y.length&&x[c]===y[c]) c++;
      if(y.length<=3 && x.length<=3) return null;
      if(c>=3 && c>=Math.min(x.length,y.length)-3) return "wE";
      if(lev(x,y)<=1) return "wT"; }
    if(diff.length===2 && diff.every(([x,y])=>W_ART.has(x)||W_ART.has(y))) return "wA";
  }
  if(vw.length===bw.length-1 && vw.every(w=>bw.includes(w))) return "wM";
  if(vw.length===bw.length+1 && bw.every(w=>vw.includes(w))) return "wX";
  if(v.length>=4 && lev(v,best)<=1) return "wT";
  return null;
}
