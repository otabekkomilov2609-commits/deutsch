<style>
/* Layout: one reading column; Momente modules as chapters, each Lektion a handout-style card with its sheets. */
:root{
  --bg:#F2F5FA; --surface:#FFFFFF; --surface-2:#E9EFF8; --ink:#17243C; --muted:#56667F; --line:#D3DCE9;
  --blue:#1F4FA0; --blue-soft:#E2EAF8; --fill:#1F4FA0; --on-fill:#fff; --orange:#C95F17; --orange-soft:#FBEADB;
  --green:#2B7653; --green-soft:#DFF0E6; --slate:#4A5872; --slate-soft:#E6EAF1;
  --shadow:0 1px 2px rgba(23,36,60,.06),0 4px 14px rgba(23,36,60,.06);
  /* shriftlar (2026-10-19, Otabek): Nunito — asosiy; Patrick Hand — qo'lyozma urg'u, ruschasi Neucha (PDF'dagidek) */
  --hand:"Patrick Hand","Neucha","Comic Neue","Comic Sans MS",cursive;
  --sans:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1524; --surface:#16203A; --surface-2:#1C2846; --ink:#E5EBF5; --muted:#9AA8C0; --line:#2A3858;
  --blue:#8DB0F0; --blue-soft:#1E2E52; --fill:#3A63C2; --on-fill:#fff; --orange:#F2A469; --orange-soft:#3A2919;
  --green:#78CDA2; --green-soft:#183A2A; --slate:#B3BFD3; --slate-soft:#243150;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1524; --surface:#16203A; --surface-2:#1C2846; --ink:#E5EBF5; --muted:#9AA8C0; --line:#2A3858;
  --blue:#8DB0F0; --blue-soft:#1E2E52; --fill:#3A63C2; --on-fill:#fff; --orange:#F2A469; --orange-soft:#3A2919;
  --green:#78CDA2; --green-soft:#183A2A; --slate:#B3BFD3; --slate-soft:#243150;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
html{font-synthesis:style} /* Patrick Hand / Neucha — bitta qalinlik: soxta qalin qilinmasin */
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:500;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
button,a,.lrn-opt{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
@media (hover:none){.lrn-opt:focus,.lrn-opt:focus-visible{outline:none}}

/* header */
header{padding-block:28px 8px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
/* telefonda UZ/RU ekrandan chiqib ketmasin: yozuv alohida qatorda, tugmalar siqilmaydi (2026-10-19) */
.lang{flex-shrink:0}.lang button{white-space:nowrap}
@media (max-width:560px){.top{flex-wrap:wrap;row-gap:10px;gap:6px}.top .eyebrow{flex-basis:100%}.topbar{justify-content:flex-end}.top .acc-chip,.top .tch-btn{margin-right:0}.top .thm-btn{flex-shrink:0}}@media (max-width:360px){.top .acc-chip{max-width:27vw;padding:5px 8px}}
.lang button{border:0;background:none;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--fill);color:var(--on-fill)}
h1.brand{display:flex;align-items:center;gap:.28em;font-size:clamp(30px,8vw,56px);white-space:nowrap}h1.brand .brand-ic{width:1.25em;height:1.25em;flex:none;margin-left:-.12em}
h1{font-family:var(--hand);font-weight:400;font-size:clamp(44px,9vw,64px);line-height:1;margin:14px 0 6px;color:var(--blue);letter-spacing:.01em}
.lead{margin:0;max-width:56ch;color:var(--muted);font-size:17px;text-wrap:pretty}.motto{font-family:var(--hand);font-weight:400;font-size:clamp(19px,4.6vw,24px);line-height:1.25;color:var(--ink);margin:-2px 0 10px;max-width:34ch;text-wrap:balance} /* shior (2026-10-21, Otabek) */
.splash{position:fixed;inset:0;z-index:2147483300;background:#fff;display:grid;align-content:center;justify-items:center;gap:4px;text-align:center;padding:24px;transition:opacity .4s}.splash.out{opacity:0;pointer-events:none}.splash svg{width:120px;height:120px}.splash .by{font-family:var(--hand);font-size:36px;color:#1E4FA3;margin:8px 0 6px}.splash .mo{font-family:var(--hand);font-size:21px;color:#14213D;max-width:260px;margin:0 auto;line-height:1.3}.splash small{display:block;margin-top:28px;color:#9aa3b2;font-size:12px}
.lead b{color:var(--ink);font-weight:600}

/* controls */
.controls{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;margin-top:10px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;box-shadow:var(--shadow)}
.search svg{flex:none;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:none;font:inherit;color:var(--ink);padding:11px 0;outline:none}
.search input::placeholder{color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.tabs{display:flex;flex-wrap:wrap;gap:4px;background:var(--surface-2);padding:4px;border-radius:12px}
.tabs button{border:0;background:none;padding:6px 12px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
/* telefonda tepadagi qotgan qism ixcham (2026-10-21, Otabek: «tepasi peshonasi juda katta, ko'p joyni yopib qo'yyapti») */
@media (max-width:640px){.controls{padding-block:8px 6px}.controls .row{gap:6px}.chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin-inline:-2px;padding:1px 2px}.chips::-webkit-scrollbar{display:none}.chip{flex:none}
 .controls.stuck .search{display:none}.controls.stuck{box-shadow:0 8px 12px -10px rgba(23,36,60,.35)}}
.chip{border:1px solid var(--line);background:var(--surface);padding:5px 11px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}
.chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}

/* sections */
main{padding-block:6px 40px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:26px 0 12px}
.sec-h h2{font-family:var(--hand);font-weight:400;font-size:28px;margin:0;line-height:1.1;text-wrap:balance}
.sec-h small{color:var(--muted);font-size:13px}

.recent{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.modul{margin-top:30px}
.modul-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.modul-h .tag{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.modul-h .rule{flex:1;height:1px;background:var(--line)}
.review{background:var(--surface-2);border-radius:14px;padding:12px;margin-bottom:12px}
.review h4{margin:0 0 10px;font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}

/* lektion card */
.lek{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;scroll-margin-top:140px}
.lek-h{display:flex;gap:14px;align-items:flex-start}
.num{flex:none;width:46px;height:46px;border-radius:50%;background:var(--fill);color:var(--on-fill);display:grid;place-items:center;font-family:var(--hand);font-size:26px;line-height:1}
.lek-h h3{margin:2px 0 2px;font-family:var(--hand);font-weight:400;font-size:24px;line-height:1.15;text-wrap:balance}
.thema{color:var(--muted);font-size:14px}
.thema .kb{font-variant-numeric:tabular-nums;white-space:nowrap}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:14px 0 0;font-size:15px}
.facts dt{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding-top:3px;white-space:nowrap}
.facts dd{margin:0;min-width:0}
.facts .g{color:var(--blue)} .facts .k{color:var(--green)} .facts .w{color:var(--orange)}
.lek.empty .facts{opacity:.95}
.none{margin-top:12px;font-size:13px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px}

/* materials */
.mats{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px;margin-top:14px}
.mat{display:flex;gap:12px;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:left;min-width:0;transition:border-color .15s,transform .15s}@media (hover:hover){
.mat:hover{border-color:var(--blue)}}
.mat a.open{color:inherit;text-decoration:none}
.mat .open{display:flex;gap:12px;flex:1;min-width:0;border:0;background:none;padding:0;text-align:left;align-items:flex-start}
.thumb{position:relative;flex:none;width:58px;aspect-ratio:210/297;border-radius:4px;background:#fff center/cover no-repeat;border:1px solid var(--line);max-width:100%}
.mat-b{min-width:0;display:flex;flex-direction:column;gap:3px}
.mat-t{font-weight:600;font-size:14.5px;line-height:1.3;overflow-wrap:break-word;-webkit-hyphens:auto;hyphens:auto}
.meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.type{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:999px}
.t-grammatik{background:var(--blue-soft);color:var(--blue)}
.t-wortschatz{background:var(--orange-soft);color:var(--orange)}
.t-sprechen{background:var(--green-soft);color:var(--green)}
.t-loesung{background:var(--slate-soft);color:var(--slate)}
.t-test{background:var(--slate-soft);color:var(--slate)}
.t-liste{background:var(--slate-soft);color:var(--slate)}
.new{color:var(--orange);font-weight:700}
.mat-act{display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;gap:6px;margin-left:auto}
.dlb{border:1px solid var(--line);background:none;border-radius:8px;font-size:15px;line-height:1;padding:5px 9px;color:var(--muted);cursor:pointer}@media (hover:hover){
.dlb:hover{color:var(--ink,inherit);border-color:var(--muted)}}
.wl-body{font-family:var(--hand)}
.wl-top{gap:10px;background:var(--blue-soft);border-color:transparent}.wl-h{display:flex;align-items:center;gap:12px}.wl-h b{display:block;font-size:24px;font-weight:400;color:var(--blue);line-height:1.15}.wl-h small{color:var(--muted);font-size:15px}
.wl-n{flex:none;width:44px;height:44px;border-radius:50%;background:var(--fill);color:var(--on-fill);display:grid;place-items:center;font-size:24px}
.wl-leg{display:flex;align-items:center;gap:6px;font-size:16px;color:var(--muted)}.wl-pr{margin-left:auto;font-size:15px}
.wl-a.der{color:var(--blue)}.wl-a.das{color:var(--green)}.wl-a.die{color:#C62828}
.wl-go{padding:12px;font-size:16px;font-family:var(--sans)}
.wl-sheet{gap:0;padding:14px 16px}
.wl-s{margin:14px 0 6px;font-size:19px;font-weight:400;color:var(--orange);display:flex;align-items:center;gap:10px}.wl-s:first-child{margin-top:0}
.wl-s::after{content:"";flex:1;height:1px;background:var(--line)}
.wl{list-style:none;margin:0;padding:0}
.wl-r{display:grid;grid-template-columns:1.2fr 1fr;column-gap:12px;row-gap:1px;padding:7px 8px;border-left:3px solid transparent;border-radius:6px}
.wl-r:nth-child(even){background:var(--surface-2)}.wl-r.d{border-left-color:var(--green)}.wl-r.h{border-left-color:#E7B23A}
.wl-de{display:flex;align-items:flex-start;gap:6px;font-size:19px;line-height:1.25;color:var(--ink);min-width:0;overflow-wrap:anywhere}
.wl-tr{font-size:17px;line-height:1.3;color:var(--ink);opacity:.85;overflow-wrap:anywhere}
.wl-ex{grid-column:1/-1;font-size:16px;color:var(--orange);padding-left:4px}
.wl-say{flex:none;border:0;background:none;padding:0 2px;font-size:15px;line-height:1.5;cursor:pointer;opacity:.75}
.wl-red .wl-de{font-size:17.5px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .wl-a.die{color:#FF8A80}}:root[data-theme="dark"] .wl-a.die{color:#FF8A80}
.lek-lrn{margin-left:auto;align-self:flex-start;flex:none;display:flex;flex-direction:column;align-items:center;gap:1px;border:1.5px solid var(--green);background:var(--green-soft);color:var(--green);border-radius:12px;font:inherit;font-size:13.5px;font-weight:800;padding:7px 10px;cursor:pointer;white-space:nowrap}

/* 💬 Muloqot (2026-10-19) */

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #lrn .lrn-mode.mu{background:#0f2f2c}}:root[data-theme="dark"] #lrn .lrn-mode.mu{background:#0f2f2c}

#lrn .mu-in::placeholder{color:var(--muted);opacity:.55;font-weight:700}

#lrn .mu-bk.ok,#lrn .mu-op.ok{border-color:var(--green);background:var(--green-soft);box-shadow:0 4px 0 var(--green)}#lrn .mu-bk.ok b{color:var(--green)}
#lrn .mu-bk.bad,#lrn .mu-op.bad{border-color:#e5484d;background:#FDECEC;box-shadow:0 4px 0 #e5484d;animation:lrnShake .35s}
#lrn .mu-op{padding:12px 14px;font-weight:700;font-size:16.5px;line-height:1.3}#lrn .mu-op.bad{opacity:.75}#lrn .mu-op.dim,.mu-bk.dim{opacity:.4}
#lrn .mu-ops{display:flex;flex-direction:column;gap:9px}

#lrn .mu-ov{position:absolute;inset:0;padding:0 4px;font-weight:800;line-height:1.5;text-align:center;white-space:pre;pointer-events:none;display:none;color:var(--ink)}
#lrn .mu-gw.mk .mu-in{color:transparent;caret-color:var(--ink)}#lrn .mu-gw.mk .mu-ov{display:block}
#lrn .mu-gw.rdy .mu-in{color:var(--green);border-color:var(--green);background:var(--green-soft)}#lrn #mu-chk.ready{background:var(--green)!important;border-color:var(--green)!important;color:#fff}#lrn .btn.primary.ready{box-shadow:0 4px 0 #1d5a3e!important}
